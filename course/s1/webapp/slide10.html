<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Security - Unit 10</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
            --danger-color: #e74c3c;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        /* --- Step Box Styling --- */
        .step-box {
            background: #e8f4fc;
            border-left: 5px solid var(--accent-color);
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 0 5px 5px 0;
            font-size: 0.95em;
        }

        /* --- Specific Styling for Tables --- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.9em;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        /* --- Question Slide --- */
        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        /* --- Controls Bar --- */
        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <!-- Image Area -->
        <div class="visual-container">
            <img id="slide-img" src="" alt="Presentation Visual">
        </div>

        <!-- Text Area (Right Side) -->
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
                <!-- Content injected via JS -->
            </div>

            <!-- Fixed Footnote -->
            <div class="slide-footer">
                Daily Cyber Security Essentials and Emergency Response
            </div>
        </div>
    </div>

    <!-- Navigation Controls -->
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; Previous</button>
        <span class="progress" id="slide-counter">1 / 12</span>
        <button id="nextBtn" onclick="changeSlide(1)">Next &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; Full Screen</button>
    </div>
</div>

<script>
    // --- Configuration ---
    // Note: Updated to 'p10-' for Unit 10 images
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p10-";
    
    // --- Slide Content Data ---
    const slides = [
        {
            id: 1,
            html: `
                <h1>Fraud & Scams in the AI Era</h1>
                <hr>
                <h3>Staying Safe in a Smarter World</h3>
                <p><strong>Unit 10</strong></p>
            `
        },
        {
            id: 2,
            html: `
                <h3>AI is "Upgrading" Old Scams</h3>
                <p>Criminals are using Artificial Intelligence to make their scams more effective.</p>
                <ul>
                    <li><strong>Phishing:</strong> Now with perfect grammar.</li>
                    <li><strong>Voice Scams:</strong> Now with realistic voice cloning.</li>
                    <li><strong>Fake Profiles:</strong> Now with photorealistic fake people.</li>
                </ul>
            `
        },
        {
            id: 3,
            html: `
                <h3>Phishing 2.0</h3>
                <table>
                    <tr>
                        <th width="50%">Before AI</th>
                        <th width="50%">After AI</th>
                    </tr>
                    <tr>
                        <td>Bad grammar & spelling.</td>
                        <td>Perfect grammar & spelling.</td>
                    </tr>
                    <tr>
                        <td>Awkward, generic text.</td>
                        <td>Persuasive, targeted, professional text.</td>
                    </tr>
                </table>
                <p style="margin-top:20px;"><strong>The old clue of "spotting bad writing" is no longer reliable.</strong></p>
            `
        },
        {
            id: 4,
            html: `
                <h3>AI Voice Cloning Scams</h3>
                <p>Scammers can take a few seconds of a voice from a public video and create a realistic clone.</p>
                <hr>
                <h2 style="color:var(--danger-color);">The "grandchild in trouble" on the phone can now sound <strong>exactly like your real grandchild.</strong></h2>
            `
        },
        {
            id: 5,
            html: `
                <h3>The Defense Against Voice Scams</h3>
                <h2>The Hang Up, Call Back Rule</h2>
                <p>If you get a frantic, high-pressure call asking for money:</p>
                <ol>
                    <li><strong>HANG UP.</strong> Even if it sounds real.</li>
                    <li><strong>CALL BACK</strong> on the phone number you know is theirs.</li>
                    <li><strong>VERIFY</strong> the story.</li>
                </ol>
                <p><em>You can also create a secret <strong>family safe word</strong> for emergencies.</em></p>
            `
        },
        {
            id: 6,
            html: `
                <h3>Deepfakes: Seeing is No Longer Believing</h3>
                <p><strong>Deepfakes</strong> are AI-generated videos that can make people look like they are saying or doing things they never did.</p>
            `
        },
        {
            id: 7,
            html: `
                <h3>Case Study: The $25 Million Deepfake Scam</h3>
                <p><strong>The Story:</strong> In 2024, a finance worker at the firm Arup was tricked into paying <strong>$25.6 Million</strong> to scammers.</p>
                <p><strong>How:</strong></p>
                <div class="step-box">
                    1. It started with a suspicious email from the "CFO".
                </div>
                <div class="step-box">
                    2. To "verify," the employee joined a video call.
                </div>
                <div class="step-box" style="border-color:var(--danger-color);">
                    3. Everyone on the call—the CFO, other colleagues—was a <strong>deepfake</strong>.
                </div>
                <div class="step-box">
                    4. Believing the orders were real, the employee made the payment.
                </div>
            `
        },
        {
            id: 8,
            html: `
                <h3>The Lesson from the Deepfake Scam</h3>
                <h2 style="color:var(--primary-color);">Verification MUST Be Out-of-Band</h2>
                <p>The employee thought the video call was verification, but the criminals controlled the entire channel.</p>
                <p style="background:#e8f4fc; padding:15px; border-radius:5px;"><strong>If you get a sensitive digital request, verify it through a separate channel that you already trust.</strong></p>
                <ul>
                    <li>Make a phone call to a known number.</li>
                    <li>Use an official, internal chat tool.</li>
                    <li>Walk down the hall and ask in person.</li>
                </ul>
            `
        },
        {
            id: 9,
            html: `
                <h3>Your #1 Defense in the AI Era</h3>
                <h1 style="font-size: 4em; color: var(--accent-color); text-align:center; margin: 30px 0;">P A U S E</h1>
                <p>AI scams are designed to make you react emotionally and act quickly.</p>
                <p>The most powerful defense is to <strong>stop and think</strong> before you click, send, or reply.</p>
            `
        },
        {
            id: 10,
            html: `
                <h3>Timeless Defenses for Future Threats</h3>
                <table style="text-align:center;">
                    <tr>
                        <th style="text-align:center;">&#128222;<br>Verify</th>
                        <th style="text-align:center;">&#128737;<br>Skepticism</th>
                        <th style="text-align:center;">&#128272;<br>Basics</th>
                    </tr>
                    <tr>
                        <td style="vertical-align:top;">Confirm requests through a different channel.</td>
                        <td style="vertical-align:top;">Question urgency and unusual requests.</td>
                        <td style="vertical-align:top;">The things we've learned (MFA, Passwords, Updates) are more important than ever.</td>
                    </tr>
                </table>
            `
        },
        {
            id: 11,
            html: `
                <h3>Your Security Toolkit: A Course Recap</h3>
                <ol>
                    <li><strong>Password Manager:</strong> Create & store strong, unique passwords.</li>
                    <li><strong>MFA:</strong> The deadbolt for your most important accounts.</li>
                    <li><strong>Updates:</strong> Keep your software maintained and patched.</li>
                    <li><strong>Backups:</strong> Your insurance policy against disaster.</li>
                    <li><strong>Skepticism:</strong> Your best, most timeless defense.</li>
                </ol>
            `
        },
        {
            id: 12,
            html: `
                <div class="question-slide">
                    <h2 style="color:var(--primary-color);">Don't be afraid of the future.<br>Be a mindful and empowered user of it.</h2>
                    <hr>
                    <h1>Questions?</h1>
                    <h1>Thank You!</h1>
                </div>
            `
        }
    ];

    // --- Logic ---
    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        
        // Image format: p10-1.jpg, p10-2.jpg, etc.
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;

        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; Exit Full Screen";
        } else {
            fsBtn.innerHTML = "&#9974; Full Screen";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
