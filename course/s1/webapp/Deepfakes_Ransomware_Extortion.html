<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Extortion Awareness 2025</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background-color: #050505; color: #e2e8f0; font-family: 'Courier New', Courier, monospace; margin: 0; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        
        /* Glitch Animations */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        .glitch-hover:hover { animation: glitch 0.3s infinite; }
        
        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 0, 0.1);
            position: absolute;
            z-index: 10;
            animation: scanline 6s linear infinite;
            opacity: 0.3;
        }
        @keyframes scanline {
            0% { top: 0% }
            100% { top: 100% }
        }
    </style>
</head>
<body>

    <div id="error-box" style="display:none; padding:20px; background:#991b1b; color:white;"></div>

    <!-- FIXED: Removed 'flex h-screen items-center' from this parent ID. 
         The centering is now only applied to the loading-content div. -->
    <div id="root">
        <div id="loading-content" class="flex h-screen items-center justify-center text-center">
            <div class="text-2xl font-bold text-purple-500 mb-2 animate-pulse">SYNTHESIZING REALITY...</div>
        </div>
    </div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const errorBox = document.getElementById('error-box');
            document.getElementById('root').style.display = 'none';
            errorBox.style.display = 'block';
            errorBox.innerHTML = `<h3>CRITICAL ERROR</h3><p>${message}</p><p>Line: ${lineno}</p>`;
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                Eye: <g><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></g>,
                Video: <g><polygon points="23 7 16 12 23 17 23 7" /><rect x="1" y="5" width="15" height="14" rx="2" ry="2" /></g>,
                Lock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>,
                Alert: <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />,
                Fingerprint: <path d="M2 12C2 6.48 6.48 2 12 2s10 4.48 10 10" />,
                UserCheck: <g><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="8.5" cy="7" r="4" /><polyline points="17 11 19 13 23 9" /></g>,
                Shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />,
                Smartphone: <g><rect x="5" y="2" width="14" height="20" rx="2" ry="2" /><line x1="12" y1="18" x2="12.01" y2="18" /></g>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-neutral-900 border border-neutral-800 rounded-none p-6 shadow-lg relative ${className}`}>
                <div className="absolute top-0 left-0 w-2 h-2 border-t border-l border-purple-500"></div>
                <div className="absolute top-0 right-0 w-2 h-2 border-t border-r border-purple-500"></div>
                <div className="absolute bottom-0 left-0 w-2 h-2 border-b border-l border-purple-500"></div>
                <div className="absolute bottom-0 right-0 w-2 h-2 border-b border-r border-purple-500"></div>
                {children}
            </div>
        );

        // --- View: Dashboard ---
        const DashboardView = () => (
            <div className="space-y-8 animate-in fade-in duration-500">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <Card className="text-center">
                        <h3 className="text-4xl font-bold text-purple-400 mb-2 glitch-hover">2,137%</h3>
                        <p className="text-gray-400 text-xs uppercase tracking-widest">Rise in Deepfake Fraud (Since 2022)</p>
                    </Card>
                    <Card className="text-center">
                        <h3 className="text-4xl font-bold text-green-400 mb-2 glitch-hover">$200M+</h3>
                        <p className="text-gray-400 text-xs uppercase tracking-widest">Q1 2025 Deepfake Losses</p>
                    </Card>
                    <Card className="text-center">
                        <h3 className="text-4xl font-bold text-red-500 mb-2 glitch-hover">8 Million</h3>
                        <p className="text-gray-400 text-xs uppercase tracking-widest">Deepfake Files Detected (2025)</p>
                    </Card>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div>
                        <h3 className="text-xl font-bold text-white mb-4 border-l-4 border-purple-500 pl-3">
                            Extortion Vectors
                        </h3>
                        <div className="space-y-4">
                            {[
                                { title: "Fake Proof-of-Life", desc: "Attackers send videos of 'kidnapped' staff begging for ransom.", risk: "High Panic" },
                                { title: "Executive Impersonation", desc: "AI clones of CEOs order urgent fund transfers via video call.", risk: "Verification Bypass" },
                                { title: "Reputational Sabotage", desc: "Fabricated scandalous videos used to threaten brand image.", risk: "$1.13M Avg Demand" }
                            ].map((item, idx) => (
                                <div key={idx} className="bg-neutral-800/50 p-4 border-l border-neutral-700">
                                    <div className="flex justify-between items-start">
                                        <h4 className="text-purple-300 font-bold">{item.title}</h4>
                                        <span className="text-xs bg-red-900/30 text-red-400 px-2 py-1 rounded">{item.risk}</span>
                                    </div>
                                    <p className="text-sm text-gray-400 mt-1">{item.desc}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div>
                        <h3 className="text-xl font-bold text-white mb-4 border-l-4 border-green-500 pl-3">
                            Detection & Defense
                        </h3>
                        <div className="bg-neutral-900 p-6 border border-neutral-700 relative overflow-hidden">
                            <div className="scanline"></div>
                            <h4 className="text-green-400 font-mono mb-4 text-sm">> INITIATING VISUAL ANALYSIS...</h4>
                            <ul className="space-y-3 text-sm text-gray-300 font-mono">
                                <li className="flex items-center gap-2">
                                    <Icon name="Eye" size={16} className="text-purple-500" />
                                    <span><strong className="text-white">Unnatural Blinking:</strong> Humans blink every 2-10s. AI often forgets or loops this.</span>
                                </li>
                                <li className="flex items-center gap-2">
                                    <Icon name="Video" size={16} className="text-purple-500" />
                                    <span><strong className="text-white">Lip Sync Glitches:</strong> Watch for audio not matching mouth shapes (phonemes).</span>
                                </li>
                                <li className="flex items-center gap-2">
                                    <Icon name="Lock" size={16} className="text-purple-500" />
                                    <span><strong className="text-white">Protocol Alpha:</strong> Establish a "Safe Word" with family/staff today.</span>
                                </li>
                            </ul>
                            <div className="mt-4 p-2 bg-purple-900/20 text-purple-200 text-xs text-center border border-purple-900">
                                TRUST NOTHING DIGITAL WITHOUT VERIFICATION
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        // --- View: Simulator ---
        const SimulatorView = () => {
            const [step, setStep] = useState(0);
            const [stress, setStress] = useState(20); // Stress meter
            const [log, setLog] = useState([]);
            const [finished, setFinished] = useState(false);

            const scenarios = [
                {
                    phase: "Incoming Transmission",
                    text: "You receive a video file via an encrypted messenger. It's your CEO, tied to a chair in a dark room. The voice says: 'They have me. Do not call the police. Transfer $500k to this wallet immediately or I die.'",
                    options: [
                        { label: "Panic & Authorize Transfer", stressMod: 20, correct: false, outcome: "FAILED. You fell for the 'Proof-of-Life' deepfake. The CEO was actually at lunch." },
                        { label: "Analyze Video for Artifacts", stressMod: -10, correct: true, outcome: "SMART. You notice the shadows on the face don't match the room lighting." },
                        { label: "Call CEO's Spouse", stressMod: -5, correct: true, outcome: "VERIFIED. Spouse confirms CEO is safe at home. It's a scam." }
                    ]
                },
                {
                    phase: "Escalation",
                    text: "The attackers realize you haven't paid. You get a live video call. It looks EXACTLY like your CFO. 'Why are you stalling? The board is watching. Send it now!'",
                    options: [
                        { label: "Argue with the Caller", stressMod: 10, correct: false, outcome: "MISTAKE. They record your voice to clone YOU next." },
                        { label: "Ask for the 'Wolfpack' Code", stressMod: -20, correct: true, outcome: "BUSTED. The caller freezes, glitches, and hangs up. They didn't know the secret phrase." },
                        { label: "Hang up & Dial CFO's Cell", stressMod: -10, correct: true, outcome: "SAFE. You used an 'Out-of-Band' communication channel." }
                    ]
                }
            ];

            const handleChoice = (opt) => {
                const newLog = [...log, { phase: scenarios[step].phase, choice: opt.label, result: opt.outcome, correct: opt.correct }];
                setLog(newLog);
                setStress(prev => Math.min(100, Math.max(0, prev + opt.stressMod)));

                if (step < scenarios.length - 1) {
                    setStep(step + 1);
                } else {
                    setFinished(true);
                }
            };

            const resetSim = () => {
                setStep(0);
                setStress(20);
                setLog([]);
                setFinished(false);
            };

            if (finished) {
                const wins = log.filter(l => l.correct).length;
                return (
                    <div className="max-w-2xl mx-auto">
                        <Card className="text-center">
                            <h2 className={`text-3xl font-bold mb-4 ${wins === scenarios.length ? 'text-green-500' : 'text-red-500'}`}>
                                {wins === scenarios.length ? "THREAT NEUTRALIZED" : "SECURITY COMPROMISED"}
                            </h2>
                            <div className="w-full bg-gray-800 h-4 rounded-full mb-6 overflow-hidden">
                                <div className={`h-full ${wins === scenarios.length ? 'bg-green-500' : 'bg-red-500'}`} style={{width: `${(wins/scenarios.length)*100}%`}}></div>
                            </div>
                            
                            <div className="text-left space-y-4 mb-8">
                                {log.map((l, i) => (
                                    <div key={i} className="bg-black/30 p-3 border-b border-gray-800">
                                        <div className="text-xs text-purple-400 mb-1">{l.phase}</div>
                                        <div className="font-bold text-white text-sm">{l.choice}</div>
                                        <div className={`text-xs mt-1 ${l.correct ? 'text-green-400' : 'text-red-400'}`}>{l.result}</div>
                                    </div>
                                ))}
                            </div>

                            <button onClick={resetSim} className="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded transition-colors">
                                REBOOT SIMULATION
                            </button>
                        </Card>
                    </div>
                );
            }

            const current = scenarios[step];

            return (
                <div className="max-w-2xl mx-auto">
                    {/* Stress Meter */}
                    <div className="mb-6 flex items-center gap-4">
                        <span className="text-xs font-mono text-red-500 animate-pulse">PSYCH_PRESSURE</span>
                        <div className="flex-1 h-2 bg-gray-800 rounded-full overflow-hidden">
                            <div className="h-full bg-gradient-to-r from-green-500 to-red-600 transition-all duration-500" style={{width: `${stress}%`}}></div>
                        </div>
                        <span className="text-xs font-mono text-gray-400">{stress}%</span>
                    </div>

                    <Card>
                        <div className="flex items-center gap-2 mb-4">
                            <div className="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
                            <span className="text-red-500 font-mono text-sm tracking-widest uppercase">Live Connection...</span>
                        </div>
                        
                        <div className="min-h-[150px] flex items-center justify-center bg-black mb-6 border border-gray-800 relative overflow-hidden group">
                            {/* Conceptual Video Screen */}
                            <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-20"></div>
                            <div className="text-center p-8 relative z-10">
                                <Icon name="UserCheck" size={64} className="mx-auto text-gray-600 mb-2 group-hover:text-purple-600 transition-colors" />
                                <p className="text-lg font-bold text-white font-mono">"{current.phase}"</p>
                                <p className="text-sm text-gray-400 mt-2">{current.text}</p>
                            </div>
                            {/* Glitch Overlay */}
                            <div className="absolute top-0 left-0 w-full h-full bg-purple-500/10 opacity-0 group-hover:opacity-100 pointer-events-none mix-blend-overlay transition-opacity"></div>
                        </div>

                        <div className="grid gap-3">
                            {current.options.map((opt, idx) => (
                                <button 
                                    key={idx} 
                                    onClick={() => handleChoice(opt)}
                                    className="text-left p-4 border border-gray-700 hover:bg-purple-900/20 hover:border-purple-500 transition-all text-sm font-mono text-gray-300 hover:text-white"
                                >
                                    > {opt.label}
                                </button>
                            ))}
                        </div>
                    </Card>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [view, setView] = useState('dashboard');

            return (
                <div className="min-h-screen pb-12 bg-black bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-neutral-900 via-black to-black">
                    {/* Fixed Navbar: Added py-2 and min-h for better zoom handling */}
                    <nav className="border-b border-gray-800 bg-black/50 backdrop-blur sticky top-0 z-50 py-2 min-h-[4rem] flex flex-col justify-center">
                        <div className="max-w-6xl mx-auto px-4 w-full flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <Icon name="Fingerprint" className="text-purple-500" />
                                <span className="font-bold text-white tracking-widest hidden md:inline">DEEP<span className="text-purple-500">FAKE</span>_DEFENSE</span>
                                <span className="font-bold text-white tracking-widest md:hidden">DF_DEFENSE</span>
                            </div>
                            <div className="flex gap-4 text-sm font-mono">
                                <button 
                                    onClick={() => setView('dashboard')}
                                    className={`${view === 'dashboard' ? 'text-purple-400 underline decoration-2 underline-offset-4' : 'text-gray-500 hover:text-white'}`}
                                >
                                    Intel
                                </button>
                                <button 
                                    onClick={() => setView('simulator')}
                                    className={`${view === 'simulator' ? 'text-purple-400 underline decoration-2 underline-offset-4' : 'text-gray-500 hover:text-white'}`}
                                >
                                    Simulate
                                </button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-6xl mx-auto px-4 py-8">
                        <div className="mb-10 text-center">
                            <h1 className="text-3xl md:text-5xl font-bold text-white mb-4 tracking-tighter leading-tight">
                                {view === 'dashboard' ? 'THE ARTIFICIAL EXTORTION WAVE' : 'ACTIVE THREAT SIMULATION'}
                            </h1>
                            <p className="text-gray-400 font-mono max-w-2xl mx-auto">
                                {view === 'dashboard' 
                                    ? 'Ransomware has evolved. It now wears the face of people you trust. Understand the threat.' 
                                    : 'A deepfake attack triggers pure panic. Test your psychological resilience now.'}
                            </p>
                        </div>

                        {view === 'dashboard' ? <DashboardView /> : <SimulatorView />}
                    </main>

                    <footer className="border-t border-gray-800 mt-12 py-8 text-center">
                        <p className="text-gray-600 text-xs font-mono">
                            SECURE_CHANNEL_ESTABLISHED // 2025 // REPORT SUSPICIOUS ACTIVITY TO FBI/IC3
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
