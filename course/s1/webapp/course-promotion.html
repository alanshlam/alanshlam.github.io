<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Promotion: Daily Cyber Security Essentials</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #c0392b; /* Urgent Red */
            --highlight-color: #d35400; /* Orange for numbers */
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.5;
            margin: 10px 0;
        }

        li {
            margin-bottom: 8px;
        }

        /* --- Specific Styling for Promo Stats --- */
        .stat-container {
            display: flex;
            gap: 15px;
            margin: 15px 0;
        }
        .stat-box {
            flex: 1;
            background: #fff8e1;
            border-top: 4px solid var(--highlight-color);
            padding: 15px;
            border-radius: 5px;
            font-size: 0.9em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .stat-header {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        .big-number {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--accent-color);
        }

        /* --- Controls Bar --- */
        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #a93226;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {

        /* --- Mobile Scrolling & Layout Fix --- */
        body {
            display: block; /* Allow natural page scrolling instead of flex centering */
            padding: 15px 0;
            align-items: normal; /* Override centering */
            justify-content: normal;
        }
        .container {
            width: 100%;
            max-height: none; /* Remove fixed height that prevents scrolling */
            height: auto;
            overflow: visible; /* Show all content */
            margin: 0;
            border-radius: 0;
            box-shadow: none;
        }
        .slide-content {
            min-height: unset; /* Let content determine its own height */
            overflow: visible;
        }
        .dynamic-content {
            overflow-y: visible; /* Disable the internal scroll area to let the page scroll */
        }
        h1 { font-size: 1.8em; }
        .controls {
            position: sticky;
            bottom: 0;
            border-top: 1px solid #ccc;
        }
        .controls button {
            padding: 12px 14px;
            min-height: 44px;
        }
        /* --- End Mobile Fix --- */
    
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .stat-container {
                flex-direction: column;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <!-- Image Area -->
        <div class="visual-container">
            <img id="slide-img" src="" alt="Presentation Visual">
        </div>

        <!-- Text Area (Right Side) -->
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
                <!-- Content injected via JS -->
            </div>

            <!-- Fixed Footnote -->
            <div class="slide-footer">
                Daily Cyber Security Essentials and Emergency Response
            </div>
        </div>
    </div>

    <!-- Navigation Controls -->
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; Previous</button>
        <span class="progress" id="slide-counter">1 / 4</span>
        <button id="nextBtn" onclick="changeSlide(1)">Next &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; Full Screen</button>
    </div>
</div>

<script>
    // --- Configuration ---
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/promo-";
    
    // --- Slide Content Data ---
    const slides = [
        {
            id: 1,
            html: `
                <h1>Why Cybersecurity is Important to YOU</h1>
                <hr>
                <p>It's not just about computers. It's about your life.</p>
                <ul>
                    <li><strong>Your Wealth:</strong> Banking apps and investment accounts are prime targets.</li>
                    <li><strong>Your Memories:</strong> 10 years of family photos can be locked by ransomware in seconds.</li>
                    <li><strong>Your Identity:</strong> A stolen identity takes months or years to fix.</li>
                </ul>
                <h3 style="color:var(--accent-color); margin-top:20px;">You lock your front door. Why leave your digital life open?</h3>
            `
        },
        {
            id: 2,
            html: `
                <h3>Hong Kong Cybercrime Trends (2024-2025)</h3>
                
                <div class="stat-container">
                    <div class="stat-box">
                        <div class="stat-header">HKCERT (2024 Report)</div>
                        <ul>
                            <li>Total Incidents: <strong>12,536</strong></li>
                            <li>Phishing Cases: <strong>7,811</strong></li>
                            <li><span class="big-number">+108%</span> increase in phishing Year-on-Year.</li>
                            <li><em>Phishing remains the leading threat.</em></li>
                        </ul>
                    </div>
                    <div class="stat-box">
                        <div class="stat-header">HK Police (Jan-Jul 2025)</div>
                        <ul>
                            <li>Financial Losses:</li>
                            <li><span class="big-number">> HK$ 3.6 Billion</span></li>
                            <li>Consistent trend of annual losses in the billions.</li>
                        </ul>
                    </div>
                </div>

                <p style="font-size:0.9em; margin-top:10px;">
                    <strong>Interpretation:</strong> Hong Kong is seeing a rapid escalation in technology-enabled crime, causing sustained economic impact to individuals like you.
                </p>
            `
        },
        {
            id: 3,
            html: `
                <h3>What Happens When You Fall into a Trap?</h3>
                <p><strong>The Domino Effect:</strong></p>
                <ul>
                    <li><strong>Personal Mistakes:</strong> You click one link. Ransomware encrypts your laptop. You lose your work and photos forever.</li>
                    <li><strong>The "Invisible" Breach:</strong> A company you use gets hacked. Your "reused" password is stolen. Hackers use it to drain your bank account.</li>
                </ul>
                <p style="background:#ffebee; padding:15px; border-radius:5px; border: 1px solid #ffcdd2;"><strong>The Consequence:</strong> Financial loss, emotional stress, and reputation damage.</p>
            `
        },
        {
            id: 4,
            html: `
                <h1>Don't Be a Victim. Be Empowered.</h1>
                <h3>Key Takeaways from This Course:</h3>
                <ol>
                    <li><strong>Spot the Scam:</strong> Learn to identify AI-driven phishing and deepfakes.</li>
                    <li><strong>Lock It Down:</strong> Master Password Managers and Multi-Factor Authentication.</li>
                    <li><strong>Recover Fast:</strong> Learn the exact "First Aid" steps if you do get hacked.</li>
                </ol>
                <hr>
                <h2 style="color:var(--primary-color);">Join "Daily Cyber Security Essentials" Today.</h2>
            `
        }
    ];

    // --- Logic ---
    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        
        // Image format: promo-1.jpg, promo-2.jpg, etc.
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;

        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; Exit Full Screen";
        } else {
            fsBtn.innerHTML = "&#9974; Full Screen";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
