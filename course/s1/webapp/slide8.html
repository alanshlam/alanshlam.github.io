<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Security - Lecture 8</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
            --danger-color: #e74c3c;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        /* --- Specific Styling for Tables (Slide 2) --- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.9em;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        /* Highlight classes */
        .highlight-danger {
            color: var(--danger-color);
            font-weight: bold;
        }
        
        /* Step Flowchart Styling */
        .step-box {
            background: #e8f4fc;
            border-left: 5px solid var(--accent-color);
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 0 5px 5px 0;
        }

        /* --- Question Slide --- */
        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        /* --- Controls Bar --- */
        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <!-- Image Area -->
        <div class="visual-container">
            <img id="slide-img" src="" alt="Presentation Visual">
        </div>

        <!-- Text Area (Right Side) -->
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
                <!-- Content injected via JS -->
            </div>

            <!-- Fixed Footnote -->
            <div class="slide-footer">
                Daily Cyber Security Essentials and Emergency Response
            </div>
        </div>
    </div>

    <!-- Navigation Controls -->
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; Previous</button>
        <span class="progress" id="slide-counter">1 / 9</span>
        <button id="nextBtn" onclick="changeSlide(1)">Next &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; Full Screen</button>
    </div>
</div>

<script>
    // --- Configuration ---
    // Note: Updated to 'p8-' for Lecture 8 images
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p8-";
    
    // --- Slide Content Data ---
    const slides = [
        {
            id: 1,
            html: `
                <h1>Network Incident First Aid</h1>
                <hr>
                <h3>What to Do When Things Go Wrong</h3>
                <p><strong>Lecture 8</strong></p>
            `
        },
        {
            id: 2,
            html: `
                <h3>The 2 Golden Rules of Incident Response</h3>
                <table>
                    <tr>
                        <th width="50%" style="text-align:center; font-size:2em;">&#128524;</th> 
                        <th width="50%" style="text-align:center; font-size:2em;">&#128465; &#10060;</th> 
                    </tr>
                    <tr>
                        <td style="text-align:center;"><h2>1. Don't Panic.</h2><p>Take a breath. Follow the procedure.</p></td>
                        <td style="text-align:center;"><h2>2. Don't Delete Anything.</h2><p>Deleting files or emails destroys evidence needed by investigators.</p></td>
                    </tr>
                </table>
            `
        },
        {
            id: 3,
            html: `
                <h3>Scenario 1: "I clicked a phishing link and entered my password!"</h3>
                
                <div class="step-box">
                    <strong>1. Change Your Password</strong><br>
                    Go to the REAL site and change your password immediately. Change it on any other site where you reuse it.
                </div>
                
                <div class="step-box">
                    <strong>2. Report It</strong><br>
                    Tell your IT/Security department (at work). Call your bank's fraud department (if it was a bank password).
                </div>
                
                <div class="step-box">
                    <strong>3. Upgrade Your Security</strong><br>
                    Turn on Multi-Factor Authentication (MFA).
                </div>
            `
        },
        {
            id: 4,
            html: `
                <h3>Scenario 2: "I see a ransomware message!"</h3>
                
                <div class="step-box" style="border-color: var(--danger-color);">
                    <strong class="highlight-danger">1. ISOLATE!</strong><br>
                    <strong>DISCONNECT FROM THE NETWORK IMMEDIATELY.</strong> Unplug the network cable or Turn Off Wi-Fi. This stops it from spreading.
                </div>
                
                <div class="step-box">
                    <strong>2. Leave It ON</strong><br>
                    <strong>DO NOT TURN OFF THE POWER.</strong> This preserves evidence.
                </div>
                
                <div class="step-box">
                    <strong>3. REPORT!</strong><br>
                    <strong>CALL</strong> your IT/Security department. This is an emergency.
                </div>
            `
        },
        {
            id: 5,
            html: `
                <h3>Ransomware Recovery</h3>
                <ul>
                    <li>Your only safe recovery option is to <strong>restore from a clean backup.</strong></li>
                    <li style="margin-top:20px; font-size:1.2em;" class="highlight-danger"><strong>DO NOT PAY THE RANSOM.</strong></li>
                </ul>
                <div style="background:#f8d7da; border: 1px solid #f5c6cb; padding:15px; border-radius:5px; margin-top:10px;">
                    <ul>
                        <li>It funds criminal activity.</li>
                        <li>There is no guarantee you will get your files back.</li>
                    </ul>
                </div>
            `
        },
        {
            id: 6,
            html: `
                <h3>Scenario 3: "My data was leaked in a breach."</h3>
                
                <div class="step-box">
                    <strong>1. Change the Lock</strong><br>
                    Go to the breached site and <strong>change your password.</strong> Change it anywhere else you reused it.
                </div>

                <div class="step-box">
                    <strong>2. Be on High Alert</strong><br>
                    Watch for targeted <strong>spear phishing</strong> emails. Criminals will use your stolen info against you.
                </div>

                <div class="step-box">
                    <strong>3. Monitor Your Accounts</strong><br>
                    Check your credit card and bank statements for fraudulent activity.
                </div>
            `
        },
        {
            id: 7,
            html: `
                <h3>Reporting Incidents at Work is a Team Sport</h3>
                <h2 style="color:var(--primary-color);">You are not getting in trouble.<br>You are helping protect the team.</h2>
                <hr>
                <p>Hiding a mistake allows an attacker to cause much more damage.</p>
                <p><strong>Report security concerns quickly and honestly.</strong></p>
            `
        },
        {
            id: 8,
            html: `
                <h3>Your Action Plan</h3>
                <ol>
                    <li><strong>Find out who to contact</strong> for a security incident at your workplace.
                        <br><em>Is it the IT Help Desk? A security hotline? An email address?</em>
                    </li>
                    <br>
                    <li><strong>Save that contact information</strong> where you can easily find it.</li>
                </ol>
            `
        },
        {
            id: 9,
            html: `
                <div class="question-slide">
                    <h1>Any Questions?</h1>
                    <hr>
                    <p>Thank you for listening!</p>
                    <p>The floor is now open for any questions regarding today's topics.</p>
                </div>
            `
        }
    ];

    // --- Logic ---
    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        
        // Image format: p8-1.jpg, p8-2.jpg, etc.
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;

        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; Exit Full Screen";
        } else {
            fsBtn.innerHTML = "&#9974; Full Screen";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
