<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Security - Unit 4</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
            --danger-color: #e74c3c;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        code {
            background: #eee;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 1.1em;
        }

        /* --- Custom Styles for Slide 3 (URL Checking) --- */
        .url-box {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 5px solid;
        }
        .url-good {
            background-color: #e8f8f5;
            border-color: var(--success-color);
        }
        .url-bad {
            background-color: #fdedec;
            border-color: var(--danger-color);
        }

        /* --- Question Slide --- */
        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        /* --- Controls Bar --- */
        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {

        /* --- Mobile Scrolling & Layout Fix --- */
        body {
            display: block; /* Allow natural page scrolling instead of flex centering */
            padding: 15px 0;
            align-items: normal; /* Override centering */
            justify-content: normal;
        }
        .container {
            width: 100%;
            max-height: none; /* Remove fixed height that prevents scrolling */
            height: auto;
            overflow: visible; /* Show all content */
            margin: 0;
            border-radius: 0;
            box-shadow: none;
        }
        .slide-content {
            min-height: unset; /* Let content determine its own height */
            overflow: visible;
        }
        .dynamic-content {
            overflow-y: visible; /* Disable the internal scroll area to let the page scroll */
        }
        h1 { font-size: 1.8em; }
        .controls {
            position: sticky;
            bottom: 0;
            border-top: 1px solid #ccc;
        }
        .controls button {
            padding: 12px 14px;
            min-height: 44px;
        }
        /* --- End Mobile Fix --- */
    
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <!-- Image Area -->
        <div class="visual-container">
            <img id="slide-img" src="" alt="Presentation Visual">
        </div>

        <!-- Text Area (Right Side) -->
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
                <!-- Content injected via JS -->
            </div>

            <!-- Fixed Footnote -->
            <div class="slide-footer">
                Daily Cyber Security Essentials and Emergency Response
            </div>
        </div>
    </div>

    <!-- Navigation Controls -->
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; Previous</button>
        <span class="progress" id="slide-counter">1 / 9</span>
        <button id="nextBtn" onclick="changeSlide(1)">Next &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; Full Screen</button>
    </div>
</div>

<script>
    // --- Configuration ---
    // Note: Updated to 'p4-' for Unit 4 images
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p4-";
    
    // --- Slide Content Data ---
    const slides = [
        {
            id: 1,
            html: `
                <h1>Secure Browsing Habits</h1>
                <hr>
                <h3>Your Rules of the Road for the Internet</h3>
                <p><strong>Unit 4</strong></p>
            `
        },
        {
            id: 2,
            html: `
                <h3>The Most Important Signal: The Padlock</h3>
                <h2><strong>HTTPS = Secure Connection</strong></h2>
                <p>It means the conversation between you and the website is private.</p>
                <div style="background:#e8f4fc; padding:15px; border-radius:5px; margin-top:20px;">
                    <strong>Rule #1: No Padlock? No Private Info.</strong>
                    <br>(Never enter passwords or credit cards on a site without it!)
                </div>
            `
        },
        {
            id: 3,
            html: `
                <h3>Can You Spot the Fake?</h3>
                
                <div class="url-box url-good">
                    <strong>Legitimate:</strong><br>
                    <code>https://www.<strong>myrealbank.com</strong>/login</code><br>
                    <em>(Domain: myrealbank.com)</em>
                </div>

                <div class="url-box url-bad">
                    <strong>FAKE:</strong><br>
                    <code>https://www.myrealbank.com.<strong>security-update.net</strong>/login</code><br>
                    <em>(Domain: security-update.net)</em>
                </div>

                <p><strong>Always check the core domain name before the first <code>/</code>.</strong></p>
            `
        },
        {
            id: 4,
            html: `
                <h3>Think Before You Click</h3>
                <p>Links can lie! A link that says <code>mybank.com</code> can secretly point somewhere else.</p>
                <ul>
                    <li><strong>On a computer: Hover</strong> your mouse over a link to see its real destination.</li>
                    <li><strong>On a phone: Press and hold</strong> the link to see the real URL.</li>
                </ul>
                <p><strong>The Golden Rule: If in doubt, type the address in yourself.</strong></p>
            `
        },
        {
            id: 5,
            html: `
                <h3>Beware: FAKE Warnings & Pop-Ups!</h3>
                <h2 style="color:var(--danger-color);"><strong>These are ALWAYS scams.</strong></h2>
                <p>Your browser and operating system will <strong>NEVER</strong> use a pop-up ad on a website to warn you about viruses.</p>
                <p>They are designed to scare you. Just close the page.</p>
            `
        },
        {
            id: 6,
            html: `
                <h3>Public Wi-Fi is like a Postcard</h3>
                <p>On an unsecured network (cafe, airport), your activity can be visible to others on the same network.</p>
                <hr>
                <p><strong>What's the solution?</strong></p>
            `
        },
        {
            id: 7,
            html: `
                <h3>VPN: Your Private Tunnel</h3>
                <p>A <strong>VPN (Virtual Private Network)</strong> creates a secure, encrypted connection.</p>
                <ul>
                    <li>It scrambles your data, making it unreadable to anyone trying to snoop on a public network.</li>
                </ul>
                <p style="background:#e8f4fc; padding:15px; border-radius:5px;"><strong>Use a VPN whenever you're on Wi-Fi you don't control.</strong></p>
            `
        },
        {
            id: 8,
            html: `
                <h3>Your Action Plan</h3>
                <ol>
                    <li><strong>Look for the Lock</strong> (https) before entering sensitive data.</li>
                    <li><strong>Hover Before You Click</strong> to verify links.</li>
                    <li><strong>Be Skeptical</strong> of all urgent pop-ups and warnings.</li>
                    <li><strong>Use a VPN</strong> on public Wi-Fi.</li>
                </ol>
            `
        },
        {
            id: 9,
            html: `
                <div class="question-slide">
                    <h1>Any Questions?</h1>
                    <hr>
                    <p>Thank you for listening!</p>
                    <p>The floor is now open for any questions regarding today's topics.</p>
                </div>
            `
        }
    ];

    // --- Logic ---
    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        
        // Image format: p4-1.jpg, p4-2.jpg, etc.
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;

        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; Exit Full Screen";
        } else {
            fsBtn.innerHTML = "&#9974; Full Screen";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
