<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 8: Network Incident First Aid</title>
    <style>
        :root {
            --primary-color: #c0392b; /* HKCERT Red style */
            --accent-color: #e74c3c;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row; 
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px; 
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        /* Specific Styling for this lecture */
        .info-box {
            background: #e8f8f5;
            border: 1px solid #a2d9ce;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
        }

        .alert-box {
            background: #fadbd8;
            color: #7b241c;
            border: 1px solid #f1948a;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            margin: 15px 0;
            text-align: center;
            font-size: 1.1em;
        }

        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #c0392b;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <!-- Image Area -->
        <div class="visual-container">
            <img id="slide-img" src="" alt="Presentation Visual" onerror="this.src='https://via.placeholder.com/600x450?text=Image+Not+Found'">
        </div>

        <!-- Text Area (Right Side) -->
        <div class="text-container">
            <!-- Dynamic Slide Content Injection Point -->
            <div id="slide-text-content" class="dynamic-content">
                <!-- Content injected via JS -->
            </div>

            <!-- Fixed Footnote -->
            <div class="slide-footer">
                Lecture 8: Network Incident First Aid (Based on HKCERT Guidelines)
            </div>
        </div>
    </div>

    <!-- Navigation Controls -->
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; Previous</button>
        
        <span class="progress" id="slide-counter">1 / 11</span>
        
        <button id="nextBtn" onclick="changeSlide(1)">Next &#8594;</button>

        <!-- Spacer -->
        <div style="flex-grow:1"></div>

        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; Full Screen</button>
    </div>
</div>

<script>
    // --- Configuration ---
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/";
    const imageFilenamePrefix = "fa-"; // fa-01.jpg, fa-02.jpg
    
    // --- Slide Content Data ---
    const slides = [
        {
            id: 1,
            html: `
                <h1>Lecture 8: Network Incident First Aid</h1>
                <hr>
                <h2>How to React When Security Breaches Strike</h2>
                <p><strong>Based on HKCERT Guidelines for SMEs</strong></p>
            `
        },
        {
            id: 2,
            html: `
                <h2>Why "Digital First Aid"?</h2>
                <p>When an incident happens, your goal isn't to perform "surgery" (fixing code).</p>
                <div class="info-box">
                    <strong>Your Goal: Stop the Bleeding.</strong>
                </div>
                <ul>
                    <li><strong>Panic</strong> causes more damage than the malware itself.</li>
                    <li><strong>Stabilize</strong> the patient first, then call the experts.</li>
                    <li>Don't try to be a hero; try to be a safety net.</li>
                </ul>
            `
        },
        {
            id: 3,
            html: `
                <h3>The HKCERT Incident Response Cycle</h3>
                <p>HKCERT defines a 4-phase lifecycle for handling incidents:</p>
                <ol>
                    <li><strong>Preparation:</strong> Getting ready before it happens (Backups, Antivirus).</li>
                    <li><strong>Detection & Analysis:</strong> Recognizing the signs.</li>
                    <li><strong>Containment, Eradication & Recovery:</strong> Stopping and fixing the threat (Our focus today).</li>
                    <li><strong>Post-Incident:</strong> Learning from mistakes.</li>
                </ol>
            `
        },
        {
            id: 4,
            html: `
                <h2>Phase 2: Detection</h2>
                <p>Is this real? Distinguishing between "It might happen" and "It IS happening".</p>
                <ul>
                    <li><strong>Precursors (Warning Signs):</strong> Suspicious emails in inbox, failed login attempts.</li>
                    <li><strong>Indicators (Danger!):</strong>
                        <ul>
                            <li>Antivirus Red Alerts 🚨</li>
                            <li>System running extremely slow 🐢</li>
                            <li>Ransom notes on screen ☠️</li>
                        </ul>
                    </li>
                </ul>
            `
        },
        {
            id: 5,
            html: `
                <h2>Phase 3: Containment</h2>
                <p>This is the most critical First Aid step.</p>
                <div class="alert-box">
                    IMMEDIATE ACTION: ISOLATE THE HOST
                </div>
                <ul>
                    <li><strong>Wired Connection:</strong> Unplug the network (LAN) cable immediately.</li>
                    <li><strong>Wireless:</strong> Turn off Wi-Fi or enable "Airplane Mode".</li>
                </ul>
                <p><strong>Why?</strong> Ransomware travels through the network to infect servers and colleagues. Cutting the bridge saves the castle.</p>
            `
        },
        {
            id: 6,
            html: `
                <h3>The "Crime Scene" Rules</h3>
                <p>Preserving evidence is vital for the experts.</p>
                <ul>
                    <li style="color:red;"><strong>❌ DO NOT REBOOT:</strong> Evidence lives in the active memory (RAM) and is lost on restart.</li>
                    <li style="color:red;"><strong>❌ DO NOT DELETE FILES:</strong> Don't try to "clean up." You are destroying clues.</li>
                    <li style="color:green;"><strong>✅ DO:</strong> Take photos of the screen (errors, ransom notes) with your phone.</li>
                </ul>
            `
        },
        {
            id: 7,
            html: `
                <h2>Eradication & Recovery</h2>
                <p>The "Hospital" Phase (Usually handled by IT).</p>
                <ol>
                    <li><strong>Eradication:</strong> Find the root cause (the open window) and remove the malware.</li>
                    <li><strong>Recovery:</strong> Restore data from <strong>Clean Backups</strong>.</li>
                </ol>
                <div class="info-box">
                    <strong>Critical Warning:</strong> Never restore backups until you are 100% sure the infection is gone, or you will just get reinfected.
                </div>
            `
        },
        {
            id: 8,
            html: `
                <h2>Reporting: Who You Gonna Call?</h2>
                <p>You are not alone. HKCERT is there to help.</p>
                <ul>
                    <li><strong>Internal:</strong> Call your IT Department or ISIRT immediately.</li>
                    <li><strong>External (Hong Kong):</strong> HKCERT</li>
                </ul>
                <div class="info-box" style="text-align:center;">
                    <h3>☎️ Hotline: 8105 6060</h3>
                    <p>(24-Hour)</p>
                    <p>📧 hkcert@hkcert.org</p>
                </div>
            `
        },
        {
            id: 9,
            html: `
                <h2>Summary: Your First Aid Action Plan</h2>
                <p>Memorize this simple checklist:</p>
                <ol style="font-size:1.2em; font-weight:bold;">
                    <li>Identify: <span style="font-weight:normal;">Is it a Precursor or an Indicator?</span></li>
                    <li>Contain: <span style="font-weight:normal;">Pull the plug / Disconnect Wi-Fi.</span></li>
                    <li>Preserve: <span style="font-weight:normal;">Don't reboot. Take photos.</span></li>
                    <li>Report: <span style="font-weight:normal;">Call IT or HKCERT (8105 6060).</span></li>
                </ol>
            `
        },
        {
            id: 10,
            html: `
                <h2>Tonight's Homework</h2>
                <p>Build your muscle memory.</p>
                <ul>
                    <li><strong>1. Save the Number:</strong> Add HKCERT (8105 6060) to your phone contacts as "Cyber Emergency".</li>
                    <li><strong>2. Locate the Cable:</strong> Look at your computer. Find the network cable. Practice unplugging it so you know exactly where it is in a panic.</li>
                </ul>
            `
        },
        {
            id: 11,
            html: `
                <div class="question-slide">
                    <h1>Any Questions?</h1>
                    <hr>
                    <p>Remember: Panic is the enemy.</p>
                    <p><strong>Pull the plug, Don't Reboot, Call for help.</strong></p>
                </div>
            `
        }
    ];

    // --- Logic ---
    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        // 1. Update Content
        textElement.innerHTML = slides[index].html;
        
        // 2. Update Image URL
        // Pads the ID with a leading zero if needed (e.g., 1 -> 01, 10 -> 10)
        const slideNum = String(slides[index].id).padStart(2, '0');
        imgElement.src = `${imageBaseUrl}${imageFilenamePrefix}${slideNum}.jpg`;

        // 3. Update Counter
        counterElement.textContent = `${index + 1} / ${totalSlides}`;

        // 4. Update Button States
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    // --- Full Screen Logic ---
    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(`Error attempting to enable full-screen mode: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; Exit Full Screen";
        } else {
            fsBtn.innerHTML = "&#9974; Full Screen";
        }
    });

    // Initialize Keyboard Navigation
    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    // Initial Load
    loadSlide(currentIndex);

</script>

</body>
</html>
