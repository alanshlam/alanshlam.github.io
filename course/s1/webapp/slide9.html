<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Security - Lecture 9</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
            --danger-color: #e74c3c;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        /* --- Step Box Styling (Flowcharts) --- */
        .step-box {
            background: #e8f4fc;
            border-left: 5px solid var(--accent-color);
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 0 5px 5px 0;
            font-size: 0.95em;
        }

        /* --- Specific Styling for Tables (Slide 11) --- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.9em;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        /* --- Question Slide --- */
        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        /* --- Controls Bar --- */
        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <!-- Image Area -->
        <div class="visual-container">
            <img id="slide-img" src="" alt="Presentation Visual">
        </div>

        <!-- Text Area (Right Side) -->
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
                <!-- Content injected via JS -->
            </div>

            <!-- Fixed Footnote -->
            <div class="slide-footer">
                Daily Cyber Security Essentials and Emergency Response
            </div>
        </div>
    </div>

    <!-- Navigation Controls -->
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; Previous</button>
        <span class="progress" id="slide-counter">1 / 12</span>
        <button id="nextBtn" onclick="changeSlide(1)">Next &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; Full Screen</button>
    </div>
</div>

<script>
    // --- Configuration ---
    // Note: Updated to 'p9-' for Lecture 9 images
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p9-";
    
    // --- Slide Content Data ---
    const slides = [
        {
            id: 1,
            html: `
                <h1>Case Discussions & Analysis</h1>
                <hr>
                <h3>Security Incidents in the Real World</h3>
                <p><strong>Lecture 9</strong></p>
            `
        },
        {
            id: 2,
            html: `
                <h3>Case #1: Target Data Breach (2013)</h3>
                <h2 style="color:var(--primary-color);"><strong>The Story:</strong></h2>
                <p>40 Million customer credit cards stolen during the holiday season.</p>
                <hr>
                <h2 style="color:var(--danger-color);"><strong>The Cause:</strong></h2>
                <p>A single phishing email.</p>
            `
        },
        {
            id: 3,
            html: `
                <h3>How the Target Breach Happened</h3>
                <div class="step-box">
                    <strong>1. Phishing Email</strong><br>
                    Sent to a 3rd-party HVAC contractor.
                </div>
                <div class="step-box">
                    <strong>2. Stolen Password</strong><br>
                    The contractor's password for Target's network was stolen.
                </div>
                <div class="step-box">
                    <strong>3. Network Breach</strong><br>
                    Hackers moved from the HVAC system into Target's main network.
                </div>
                <div class="step-box">
                    <strong>4. Malware on Checkout Systems</strong><br>
                    Hackers stolen card numbers as they were swiped.
                </div>
            `
        },
        {
            id: 4,
            html: `
                <h3>The Lesson from Target</h3>
                <h2 style="color:var(--primary-color);"><strong>Your security is only as strong as your weakest link.</strong></h2>
                <p style="margin-top:20px;">A simple phishing attack on a seemingly unimportant partner led to a catastrophic breach. Everyone is a target.</p>
            `
        },
        {
            id: 5,
            html: `
                <h3>Case #2: Colonial Pipeline Ransomware (2021)</h3>
                <h2 style="color:var(--primary-color);"><strong>The Story:</strong></h2>
                <p>The largest fuel pipeline in the US was shut down by ransomware, causing shortages across the East Coast.</p>
                <hr>
                <h2 style="color:var(--danger-color);"><strong>The Cause:</strong></h2>
                <p>A single stolen password.</p>
            `
        },
        {
            id: 6,
            html: `
                <h3>How the Pipeline Was Hacked</h3>
                <div class="step-box">
                    <strong>1. The Discovery</strong><br>
                    Hackers found a valid employee password on the dark web.
                </div>
                <div class="step-box">
                    <strong>2. The Access</strong><br>
                    They used it to log into the company's remote access <strong>VPN</strong>.
                </div>
                <div class="step-box" style="border-color:var(--danger-color);">
                    <strong>3. The Failure</strong><br>
                    The account <strong>DID NOT HAVE MFA ENABLED.</strong> The attackers walked right through the front door.
                </div>
            `
        },
        {
            id: 7,
            html: `
                <h3>The Lesson from Colonial Pipeline</h3>
                <p>This entire national crisis could have been prevented by:</p>
                <h1 style="color:var(--accent-color); font-size:2.5em; margin:20px 0;">Multi-Factor Authentication (MFA)</h1>
                <p><strong>It is not optional. It is essential.</strong></p>
            `
        },
        {
            id: 8,
            html: `
                <h3>Case #3: The Twitter "Bitcoin Scam" (2020)</h3>
                <h2 style="color:var(--primary-color);"><strong>The Story:</strong></h2>
                <p>Accounts of politicians and celebrities were hacked to tweet a crypto scam.</p>
                <hr>
                <h2 style="color:var(--danger-color);"><strong>The Cause:</strong></h2>
                <p>Hacking the humans.</p>
            `
        },
        {
            id: 9,
            html: `
                <h3>How the Twitter Accounts Were Hacked</h3>
                <p>This was <strong>Social Engineering.</strong></p>
                <div class="step-box">
                    <strong>1. The Call</strong><br>
                    Attackers <strong>called</strong> Twitter employees on the phone.
                </div>
                <div class="step-box">
                    <strong>2. The Disguise</strong><br>
                    They pretended to be from the internal IT Help Desk.
                </div>
                <div class="step-box">
                    <strong>3. The Trick</strong><br>
                    They tricked the employees into giving up their passwords for internal tools.
                </div>
            `
        },
        {
            id: 10,
            html: `
                <h3>The Lesson from Twitter</h3>
                <h2 style="color:var(--primary-color);"><strong>You are the last line of defense.</strong></h2>
                <p style="margin-top:20px;">The strongest technical security can be bypassed by tricking a person.</p>
                <p style="background:#e8f4fc; padding:15px; border-radius:5px; margin-top:15px;"><strong>Be skeptical of unusual or urgent requests, even if they seem to come from inside your own company.</strong></p>
            `
        },
        {
            id: 11,
            html: `
                <h3>Summary of Lessons</h3>
                <table>
                    <tr>
                        <th width="30%">Case</th>
                        <th width="30%">The Failure</th>
                        <th width="40%">The Lesson</th>
                    </tr>
                    <tr>
                        <td><strong>Target</strong></td>
                        <td>Phishing</td>
                        <td>Everyone is a target.</td>
                    </tr>
                    <tr>
                        <td><strong>Colonial Pipeline</strong></td>
                        <td>No MFA</td>
                        <td>MFA is not optional.</td>
                    </tr>
                    <tr>
                        <td><strong>Twitter</strong></td>
                        <td>Social Engineering</td>
                        <td>People are the target.</td>
                    </tr>
                </table>
                <p style="margin-top:20px;"><strong>The basics we've learned in this course could have prevented them all.</strong></p>
            `
        },
        {
            id: 12,
            html: `
                <div class="question-slide">
                    <h1>Any Questions?</h1>
                    <hr>
                    <p>Thank you for listening!</p>
                    <p>The floor is now open for any questions regarding today's topics.</p>
                </div>
            `
        }
    ];

    // --- Logic ---
    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        
        // Image format: p9-1.jpg, p9-2.jpg, etc.
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;

        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; Exit Full Screen";
        } else {
            fsBtn.innerHTML = "&#9974; Full Screen";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
