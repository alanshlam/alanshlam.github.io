<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Security - Lecture 5</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
            --danger-color: #e74c3c;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        /* --- Specific Styling for Tables (Slide 6) --- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.9em;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        /* --- Question Slide --- */
        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        /* --- Controls Bar --- */
        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <!-- Image Area -->
        <div class="visual-container">
            <img id="slide-img" src="" alt="Presentation Visual">
        </div>

        <!-- Text Area (Right Side) -->
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
                <!-- Content injected via JS -->
            </div>

            <!-- Fixed Footnote -->
            <div class="slide-footer">
                Daily Cyber Security Essentials and Emergency Response
            </div>
        </div>
    </div>

    <!-- Navigation Controls -->
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; Previous</button>
        <span class="progress" id="slide-counter">1 / 9</span>
        <button id="nextBtn" onclick="changeSlide(1)">Next &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; Full Screen</button>
    </div>
</div>

<script>
    // --- Configuration ---
    // Note: Updated to 'p5-' for Lecture 5 images
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p5-";
    
    // --- Slide Content Data ---
    const slides = [
        {
            id: 1,
            html: `
                <h1>Safety Measures for Email & Online Transactions</h1>
                <hr>
                <h3>Lecture 5</h3>
            `
        },
        {
            id: 2,
            html: `
                <h3>Your Email: The Keys to Your Digital Kingdom</h3>
                <p>Your email account can reset the passwords for nearly all your other services (Bank, Shopping, Social Media).</p>
                <p style="background:#e8f4fc; padding:15px; border-radius:5px;"><strong>It is your most important account to protect.</strong></p>
            `
        },
        {
            id: 3,
            html: `
                <h3>Email Threat #1: Advanced Phishing</h3>
                <p>You already know about generic phishing. Criminals are getting smarter.</p>
                <p><strong>Spear Phishing:</strong></p>
                <ul>
                    <li>A targeted attack that uses your <strong>name, job, or personal details</strong> to seem more legitimate.</li>
                    <li><strong>Example:</strong> "Hi Sarah, following up on our meeting..."</li>
                    <li>The goal is the same: trick you into clicking a bad link or opening a malicious file.</li>
                </ul>
                <p><strong>Be suspicious, even if an email seems personal.</strong></p>
            `
        },
        {
            id: 4,
            html: `
                <h3>Email Threat #2: Malicious Attachments</h3>
                <h2 style="color:var(--danger-color);"><strong>Golden Rule: Never open an unexpected attachment.</strong></h2>
                <p>Even if it's from someone you know, their account might be hacked.</p>
                <p><strong>What to do:</strong></p>
                <ul>
                    <li><strong>Verify with the sender</strong> through another method.</li>
                    <li>Send a quick text: <em>"Did you just send me an invoice?"</em></li>
                </ul>
            `
        },
        {
            id: 5,
            html: `
                <h3>Shopping Online? Rule #1 is Simple.</h3>
                <h2>Look for the Lock.</h2>
                <p>This is <strong>non-negotiable</strong> for any site where you enter payment information.</p>
            `
        },
        {
            id: 6,
            html: `
                <h3>Credit Card vs. Debit Card for Online Shopping</h3>
                <table>
                    <tr>
                        <th width="50%">Credit Card &#9989;</th>
                        <th width="50%">Debit Card &#10060;</th>
                    </tr>
                    <tr>
                        <td><strong>Using the BANK'S money.</strong></td>
                        <td><strong>Using YOUR money.</strong></td>
                    </tr>
                    <tr>
                        <td>Excellent fraud protection.</td>
                        <td>Money is gone instantly.</td>
                    </tr>
                    <tr>
                        <td>Your liability is limited.</td>
                        <td>Can be difficult to get money back.</td>
                    </tr>
                </table>
                <p style="margin-top:20px;"><strong>Use a CREDIT card for online purchases. It's your safety net.</strong></p>
            `
        },
        {
            id: 7,
            html: `
                <h3>"Too Good to Be True?"</h3>
                <h2>If a deal looks too good to be true, it is.</h2>
                <ul>
                    <li>Scam websites often pop up on social media.</li>
                    <li>They take your money and card info, then disappear.</li>
                    <li><strong>Stick to reputable, well-known stores.</strong></li>
                </ul>
            `
        },
        {
            id: 8,
            html: `
                <h3>Your Action Plan</h3>
                <ol>
                    <li><strong>Treat every unexpected email link and attachment with suspicion.</strong> Verify before clicking.</li>
                    <br>
                    <li><strong>Use a CREDIT CARD for online shopping</strong>, never a debit card.</li>
                    <br>
                    <li><strong>Review your bank and credit card statements</strong> every month to spot fraud early.</li>
                </ol>
            `
        },
        {
            id: 9,
            html: `
                <div class="question-slide">
                    <h1>Any Questions?</h1>
                    <hr>
                    <p>Thank you for listening!</p>
                    <p>The floor is now open for any questions regarding today's topics.</p>
                </div>
            `
        }
    ];

    // --- Logic ---
    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        
        // Image format: p5-1.jpg, p5-2.jpg, etc.
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;

        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; Exit Full Screen";
        } else {
            fsBtn.innerHTML = "&#9974; Full Screen";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
