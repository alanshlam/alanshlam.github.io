<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Security - Unit 7</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
            --danger-color: #e74c3c;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        /* --- Specific Styling for Tables --- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.9em;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        /* Link styling */
        a {
            color: var(--accent-color);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        /* --- Question Slide --- */
        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        /* --- Controls Bar --- */
        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <!-- Image Area -->
        <div class="visual-container">
            <img id="slide-img" src="" alt="Presentation Visual">
        </div>

        <!-- Text Area (Right Side) -->
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
                <!-- Content injected via JS -->
            </div>

            <!-- Fixed Footnote -->
            <div class="slide-footer">
                Daily Cyber Security Essentials and Emergency Response
            </div>
        </div>
    </div>

    <!-- Navigation Controls -->
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; Previous</button>
        <span class="progress" id="slide-counter">1 / 11</span>
        <button id="nextBtn" onclick="changeSlide(1)">Next &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; Full Screen</button>
    </div>
</div>

<script>
    // --- Configuration ---
    // Note: Updated to 'p7-' for Unit 7 images
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p7-";
    
    // --- Slide Content Data ---
    const slides = [
        {
            id: 1,
            html: `
                <h1>Common Network Incidents</h1>
                <hr>
                <h3>A Threat Briefing</h3>
                <p><strong>Unit 7</strong></p>
            `
        },
        {
            id: 2,
            html: `
                <h3>What is a Security Incident?</h3>
                <p>An event where the security of your information is threatened.</p>
                <ol>
                    <li><strong>Phishing Attack</strong> (Deception)</li>
                    <li><strong>Ransomware Attack</strong> (Disruption)</li>
                    <li><strong>Data Leak / Breach</strong> (Theft)</li>
                </ol>
            `
        },
        {
            id: 3,
            html: `
                <h3>Incident #1: The Phishing Attack</h3>
                <p><strong>Goal:</strong> To steal your login credentials.</p>
                <p><strong>How it works:</strong></p>
                <ol>
                    <li><strong>The Bait:</strong> A deceptive email is sent with a fake login link.</li>
                    <li><strong>The Mistake:</strong> You click the link and enter your username and password.</li>
                    <li><strong>The Incident:</strong> The attacker captures your credentials and hijacks your real account.</li>
                </ol>
            `
        },
        {
            id: 4,
            html: `
                <h3>Incident #2: The Ransomware Attack</h3>
                <p><strong>Goal:</strong> To hold your files hostage for money.</p>
                <p><strong>How it works:</strong></p>
                <ol>
                    <li><strong>The Entry:</strong> You open a malicious email attachment.</li>
                    <li><strong>The Infection:</strong> Ransomware silently installs and starts encrypting your files.</li>
                    <li><strong>The Crisis:</strong> A ransom note appears. All your data is locked.</li>
                </ol>
            `
        },
        {
            id: 5,
            html: `
                <h3>The Impact of Ransomware</h3>
                <table style="text-align:center;">
                    <tr>
                        <th style="text-align:center; padding:20px;">&#127981;<br>Operations Halt</th>
                        <th style="text-align:center; padding:20px;">&#128274;<br>Data Inaccessible</th>
                        <th style="text-align:center; padding:20px;">&#128184;<br>Major Financial Loss</th>
                    </tr>
                </table>
                <h2 style="margin-top:20px;"><strong>Backups are your #1 defense.</strong></h2>
            `
        },
        {
            id: 6,
            html: `
                <h3>Incident #3: The Data Leak / Breach</h3>
                <p><strong>Goal:</strong> To steal sensitive information in bulk.</p>
                <p><strong>What it is:</strong> Your personal data (email, password, credit card info) is stolen from a company's database.</p>
                <p><strong>How it happens:</strong> Hacking, stolen passwords, or even just accidents.</p>
            `
        },
        {
            id: 7,
            html: `
                <h3>Why Should You Care About a Breach?</h3>
                <p>Your leaked password will be used by criminals to try and access your <strong>other</strong> accounts.</p>
                <div style="background:#e8f4fc; padding:15px; border-radius:5px; margin:15px 0;">
                    <strong>This is called "Credential Stuffing".</strong>
                </div>
                <p>It relies on the fact that people <strong>reuse passwords</strong>.</p>
            `
        },
        {
            id: 8,
            html: `
                <h3>Have You Been in a Breach?</h3>
                <p>You can check if your email address has been exposed in a known data breach.</p>
                <p>Visit this free, safe, and reputable site:</p>
                <h2><a href="https://haveibeenpwned.com" target="_blank">haveibeenpwned.com</a></h2>
            `
        },
        {
            id: 9,
            html: `
                <h3>Summary of Incidents</h3>
                <table>
                    <tr>
                        <th>Incident</th>
                        <th>Is an Attack on...</th>
                    </tr>
                    <tr>
                        <td><strong>Phishing</strong></td>
                        <td>Your Trust (Deception)</td>
                    </tr>
                    <tr>
                        <td><strong>Ransomware</strong></td>
                        <td>Your Access (Disruption)</td>
                    </tr>
                    <tr>
                        <td><strong>Data Leak</strong></td>
                        <td>Your Information (Theft)</td>
                    </tr>
                </table>
            `
        },
        {
            id: 10,
            html: `
                <h3>Next time...</h3>
                <h1><strong>What to do WHEN an incident happens.</strong></h1>
            `
        },
        {
            id: 11,
            html: `
                <div class="question-slide">
                    <h1>Any Questions?</h1>
                    <hr>
                    <p>Thank you for listening!</p>
                    <p>The floor is now open for any questions regarding today's topics.</p>
                </div>
            `
        }
    ];

    // --- Logic ---
    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        
        // Image format: p7-1.jpg, p7-2.jpg, etc.
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;

        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; Exit Full Screen";
        } else {
            fsBtn.innerHTML = "&#9974; Full Screen";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
