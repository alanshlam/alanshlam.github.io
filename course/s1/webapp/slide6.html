<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Security - Unit 6</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
            --danger-color: #e74c3c;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        /* --- Specific Styling for Tables (Slide 7) --- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.9em;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        /* --- Question Slide --- */
        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        /* --- Controls Bar --- */
        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <!-- Image Area -->
        <div class="visual-container">
            <img id="slide-img" src="" alt="Presentation Visual">
        </div>

        <!-- Text Area (Right Side) -->
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
                <!-- Content injected via JS -->
            </div>

            <!-- Fixed Footnote -->
            <div class="slide-footer">
                Daily Cyber Security Essentials and Emergency Response
            </div>
        </div>
    </div>

    <!-- Navigation Controls -->
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; Previous</button>
        <span class="progress" id="slide-counter">1 / 10</span>
        <button id="nextBtn" onclick="changeSlide(1)">Next &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; Full Screen</button>
    </div>
</div>

<script>
    // --- Configuration ---
    // Note: Updated to 'p6-' for Unit 6 images
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p6-";
    
    // --- Slide Content Data ---
    const slides = [
        {
            id: 1,
            html: `
                <h1>System Updates & Information Protection</h1>
                <hr>
                <h3>Maintenance and Insurance for Your Digital Life</h3>
                <p><strong>Unit 6</strong></p>
            `
        },
        {
            id: 2,
            html: `
                <h3>Part 1: System Updates (Maintenance)</h3>
                <h2 style="color:var(--primary-color);">Updates are not an annoyance.<br>They are a free, essential security service.</h2>
                <p style="margin-top:20px;">Ignoring a software update is like ignoring a car recall for faulty brakes.</p>
            `
        },
        {
            id: 3,
            html: `
                <h3>What Needs Updating?</h3>
                <p><strong>Priority #1: Your Operating System</strong><br>
                Windows, macOS, iOS, Android. This is the foundation of your device.</p>
                
                <p><strong>Priority #2: Your Web Browser</strong><br>
                Chrome, Safari, Firefox. This is your window to the internet and a prime target.</p>
                
                <p><strong>Priority #3: Your Applications</strong><br>
                Zoom, Office, Adobe, etc.</p>
                
                <p style="background:#e8f4fc; padding:15px; border-radius:5px; margin-top:15px;"><strong>The Golden Rule: Turn On AUTOMATIC Updates!</strong></p>
            `
        },
        {
            id: 4,
            html: `
                <h3>Part 2: Information Protection (Insurance)</h3>
                <p>What happens if the worst happens?</p>
                <ul>
                    <li><strong>Ransomware</strong> locks your files.</li>
                    <li>Your device is <strong>lost or stolen</strong>.</li>
                    <li>Your hard drive <strong>fails</strong>.</li>
                </ul>
                <h2 style="color:var(--danger-color); margin-top:20px;">Your files could be gone forever...</h2>
            `
        },
        {
            id: 5,
            html: `
                <h2>...Unless You Have a Backup.</h2>
                <p>A <strong>backup</strong> is simply a <strong>second copy</strong> of your important files, stored somewhere else.</p>
                <hr>
                <p><strong>It's your insurance policy for your digital life.</strong></p>
            `
        },
        {
            id: 6,
            html: `
                <h3>The 3-2-1 Backup Strategy</h3>
                <ol>
                    <li>Keep <strong>3 copies</strong> of your data.
                        <br><em>(The original + 2 backups)</em>
                    </li>
                    <br>
                    <li>On <strong>2 different media</strong>.
                        <br><em>(e.g., Your computer + an external drive)</em>
                    </li>
                    <br>
                    <li>With <strong>1 copy off-site</strong>.
                        <br><em>(e.g., In the cloud)</em>
                    </li>
                </ol>
            `
        },
        {
            id: 7,
            html: `
                <h3>Easy Backup Methods</h3>
                <table>
                    <tr>
                        <th width="50%">Cloud Backup (Off-site) &#9729;</th>
                        <th width="50%">Local Backup (At Home) &#128190;</th>
                    </tr>
                    <tr>
                        <td><strong>Google Drive / One</strong></td>
                        <td><strong>External Hard Drive</strong></td>
                    </tr>
                    <tr>
                        <td><strong>Microsoft OneDrive</strong></td>
                        <td>Use <strong>File History</strong> (Windows)</td>
                    </tr>
                    <tr>
                        <td><strong>Apple iCloud</strong></td>
                        <td>Use <strong>Time Machine</strong> (macOS)</td>
                    </tr>
                </table>
                <p style="margin-top:20px;"><em>Cloud services often back up your most important folders automatically.</em></p>
            `
        },
        {
            id: 8,
            html: `
                <h3>What Should You Back Up?</h3>
                <h2><strong>Anything you cannot replace.</strong></h2>
                <ul>
                    <li>You can always re-download applications.</li>
                    <li>You can't re-download your family photos.</li>
                </ul>
                <p style="background:#e8f4fc; padding:15px; border-radius:5px; margin-top:20px;"><strong>Focus on your personal files.</strong></p>
            `
        },
        {
            id: 9,
            html: `
                <h3>Your Action Plan</h3>
                <ol>
                    <li><strong>Check your main device</strong> (phone or computer) and confirm that <strong>Automatic Updates</strong> are enabled.</li>
                    <br>
                    <li><strong>Identify your most important files.</strong> Ensure you have at least one other copy of them somewhere safe (in the cloud or on a separate drive).</li>
                </ol>
            `
        },
        {
            id: 10,
            html: `
                <div class="question-slide">
                    <h1>Any Questions?</h1>
                    <hr>
                    <p>Thank you for listening!</p>
                    <p>The floor is now open for any questions regarding today's topics.</p>
                </div>
            `
        }
    ];

    // --- Logic ---
    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        
        // Image format: p6-1.jpg, p6-2.jpg, etc.
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;

        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; Exit Full Screen";
        } else {
            fsBtn.innerHTML = "&#9974; Full Screen";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
