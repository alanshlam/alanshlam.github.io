<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ransomware Defense Training 2025</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        
        .glow-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .glow-red { text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        
        /* Error box style */
        #error-box { display: none; padding: 20px; background: #ef4444; color: white; margin: 20px; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="error-box"></div>

    <div id="root" class="flex h-screen items-center justify-center">
        <div class="text-center animate-pulse">
            <div class="text-2xl font-bold text-red-500 mb-2 font-mono">INITIALIZING DEFENSE SYSTEMS...</div>
            <div class="text-slate-500 text-sm">Loading modules...</div>
        </div>
    </div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const errorBox = document.getElementById('error-box');
            const root = document.getElementById('root');
            root.style.display = 'none';
            errorBox.style.display = 'block';
            errorBox.innerHTML = `<h3 class="font-bold">System Failure</h3><p>${message}</p><p>Line: ${lineno}</p>`;
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                Shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />,
                Alert: <g><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></g>,
                Zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />,
                Lock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>,
                Server: <g><rect x="2" y="2" width="20" height="8" rx="2" ry="2" /><rect x="2" y="14" width="20" height="8" rx="2" ry="2" /><line x1="6" y1="6" x2="6.01" y2="6" /><line x1="6" y1="18" x2="6.01" y2="18" /></g>,
                Dollar: <g><line x1="12" y1="1" x2="12" y2="23" /><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" /></g>,
                Activity: <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />,
                UserX: <g><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="8.5" cy="7" r="4" /><line x1="18" y1="8" x2="23" y2="13" /><line x1="23" y1="8" x2="18" y2="13" /></g>,
                ChevronRight: <polyline points="9 18 15 12 9 6" />
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-xl relative overflow-hidden ${className}`}>
                {children}
            </div>
        );

        // --- View: Dashboard ---
        const DashboardView = () => (
            <div className="space-y-6 animate-in fade-in duration-500">
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <Card className="border-red-900/30">
                        <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="Dollar" size={64} /></div>
                        <p className="text-gray-400 text-sm font-medium uppercase tracking-wider">Avg Ransom Paid (Q2 2025)</p>
                        <h3 className="text-3xl font-bold text-white mt-2 glow-text">$1.13 Million</h3>
                        <p className="text-xs text-red-400 mt-2 flex items-center gap-1"><Icon name="Activity" size={12} /> Up from 2024</p>
                    </Card>
                    <Card className="border-blue-900/30">
                        <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="Zap" size={64} /></div>
                        <p className="text-gray-400 text-sm font-medium uppercase tracking-wider">AI Adoption</p>
                        <h3 className="text-3xl font-bold text-white mt-2 glow-text">80%</h3>
                        <p className="text-xs text-blue-400 mt-2">of incidents now use AI</p>
                    </Card>
                    <Card className="border-yellow-900/30">
                        <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="Activity" size={64} /></div>
                        <p className="text-gray-400 text-sm font-medium uppercase tracking-wider">Intrusion Speed</p>
                        {/* Fixed: changed < to &lt; */}
                        <h3 className="text-3xl font-bold text-white mt-2">&lt; 25 Mins</h3>
                        <p className="text-xs text-yellow-500 mt-2">Time to lateral movement</p>
                    </Card>
                    <Card className="border-purple-900/30">
                        <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="Lock" size={64} /></div>
                        <p className="text-gray-400 text-sm font-medium uppercase tracking-wider">Impact</p>
                        <h3 className="text-3xl font-bold text-white mt-2">76%</h3>
                        <p className="text-xs text-purple-400 mt-2">Orgs failing to defend</p>
                    </Card>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <Card className="lg:col-span-2">
                        <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                            <Icon name="Activity" className="text-red-500" /> The 2025 Attack Chain
                        </h3>
                        <div className="space-y-4">
                            {[
                                { step: "1. Access", tool: "GenAI Vishing", desc: "AI voice clones fool helpdesk into resetting passwords." },
                                { step: "2. Recon", tool: "Auto-Scanners", desc: "AI maps critical assets (healthcare/energy nodes) instantly." },
                                { step: "3. Malware", tool: "LLM Polymorphism", desc: "Code mutates every execution to bypass antivirus signatures." },
                                { step: "4. Extortion", tool: "Deepfake Threats", desc: "AI generates video of CEO 'admitting' fault to pressure payment." }
                            ].map((item, idx) => (
                                <div key={idx} className="flex items-center gap-4 p-3 bg-gray-800/50 rounded-lg border border-gray-700 hover:border-blue-500 transition-colors">
                                    <div className="bg-blue-900/20 text-blue-400 px-3 py-1 rounded font-mono text-sm whitespace-nowrap">{item.step}</div>
                                    <div>
                                        <div className="text-white font-semibold">{item.tool}</div>
                                        <div className="text-gray-400 text-sm">{item.desc}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </Card>

                    <Card>
                        <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                            <Icon name="Shield" className="text-green-500" /> Defense Strategy
                        </h3>
                        <div className="space-y-4 text-sm text-gray-300">
                            <p><strong className="text-white">Tech Layer:</strong> Deploy Agentic AI defense tools (e.g., CrowdStrike) to fight bots with bots.</p>
                            <p><strong className="text-white">Human Layer:</strong> Verify all urgent calls. If the CEO calls asking for money, hang up and call back.</p>
                            <p><strong className="text-white">Backups:</strong> Maintain offline, immutable backups. AI cannot encrypt what it cannot reach.</p>
                            <div className="mt-6 p-4 bg-red-900/20 border border-red-900 rounded">
                                <div className="text-red-400 font-bold text-xs uppercase mb-1">Critical Warning</div>
                                Trend Micro warns of "Agentic AI" hijacking Windows 11 Copilot features in 2026. Patch immediately.
                            </div>
                        </div>
                    </Card>
                </div>
            </div>
        );

        // --- View: Simulator ---
        const SimulatorView = () => {
            const [gameState, setGameState] = useState('intro'); // intro, playing, end
            const [scenarioIndex, setScenarioIndex] = useState(0);
            const [log, setLog] = useState([]);
            const [stats, setStats] = useState({ budget: 100, integrity: 100 }); // Budget in $K, Integrity %

            const scenarios = [
                {
                    title: "Incoming Voice Alert",
                    desc: "Your Help Desk reports a call from the 'CEO' demanding an urgent password reset for a merger deal. The voice sounds perfect (Audio Deepfake).",
                    options: [
                        { label: "Authorize Reset (It's the CEO!)", impact: { integrity: -50, budget: 0 }, result: "Fail. It was an AI clone. Attackers now have admin access." },
                        { label: "Verify via Secret Phrase", impact: { integrity: 0, budget: 0 }, result: "Success. The caller couldn't provide the safe word and hung up." },
                        { label: "Ignore Report", impact: { integrity: -20, budget: 0 }, result: "Risky. The attacker tries another employee and succeeds later." }
                    ]
                },
                {
                    title: "Network Anomaly",
                    desc: "Behavioral AI detects lateral movement. A server is sending high-volume data to an unknown IP. It might be a backup, or it might be exfiltration.",
                    options: [
                        { label: "Auto-Isolate Server (AI Response)", impact: { integrity: 0, budget: -10 }, result: "Good. You stopped the data theft. Minor downtime cost." },
                        { label: "Manual Investigation", impact: { integrity: -30, budget: 0 }, result: "Too slow. By the time you checked logs, 500GB was stolen." }
                    ]
                },
                {
                    title: "Ransom Demand",
                    desc: "Files are encrypted. A chatbot pops up: 'We have your data. Pay $1.13M or we leak the CEO's private videos (Deepfakes).'",
                    options: [
                        { label: "Pay the Ransom", impact: { integrity: -10, budget: -100 }, result: "Bad idea. They took the money and asked for more. Decryption failed." },
                        { label: "Restore from Offline Backups", impact: { integrity: 0, budget: -20 }, result: "Excellent. System restored in 6 hours. Zero payment made." }
                    ]
                }
            ];

            const handleOption = (option) => {
                const newStats = {
                    budget: stats.budget + option.impact.budget,
                    integrity: stats.integrity + option.impact.integrity
                };
                setStats(newStats);
                setLog([...log, { stage: scenarioIndex + 1, choice: option.label, result: option.result }]);
                
                if (scenarioIndex < scenarios.length - 1) {
                    setScenarioIndex(scenarioIndex + 1);
                } else {
                    setGameState('end');
                }
            };

            const resetGame = () => {
                setGameState('intro');
                setScenarioIndex(0);
                setLog([]);
                setStats({ budget: 100, integrity: 100 });
            };

            if (gameState === 'intro') {
                return (
                    <div className="max-w-2xl mx-auto text-center pt-12">
                        <div className="inline-block p-4 rounded-full bg-red-900/30 mb-6 border border-red-500">
                            <Icon name="Alert" size={48} className="text-red-500" />
                        </div>
                        <h2 className="text-3xl font-bold text-white mb-4">CISO Crisis Simulator</h2>
                        <p className="text-gray-400 mb-8 text-lg">
                            You are the Chief Security Officer. It is 2025. 
                            An AI-driven ransomware group "El Dorado" is targeting your firm.
                            Make the right choices to save the company.
                        </p>
                        <button onClick={() => setGameState('playing')} className="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg hover:shadow-red-900/50 transition-all">
                            Start Simulation
                        </button>
                    </div>
                );
            }

            if (gameState === 'end') {
                const survived = stats.integrity > 50 && stats.budget > 0;
                return (
                    <div className="max-w-2xl mx-auto pt-8">
                        <Card className={`text-center border-2 ${survived ? 'border-green-500' : 'border-red-500'}`}>
                            <h2 className={`text-3xl font-bold mb-2 ${survived ? 'text-green-500' : 'text-red-500'}`}>
                                {survived ? "THREAT NEUTRALIZED" : "SYSTEM COMPROMISED"}
                            </h2>
                            <p className="text-gray-400 mb-6">Simulation Complete</p>
                            
                            <div className="grid grid-cols-2 gap-4 mb-8">
                                <div className="bg-gray-900 p-4 rounded">
                                    <div className="text-sm text-gray-500">System Integrity</div>
                                    <div className={`text-2xl font-bold ${stats.integrity > 50 ? 'text-green-400' : 'text-red-400'}`}>{stats.integrity}%</div>
                                </div>
                                <div className="bg-gray-900 p-4 rounded">
                                    <div className="text-sm text-gray-500">Budget Impact</div>
                                    <div className="text-2xl font-bold text-white">{stats.budget <= 0 ? "Bankrupt" : "Stable"}</div>
                                </div>
                            </div>

                            <div className="text-left space-y-3 mb-8">
                                <h4 className="font-bold text-white border-b border-gray-700 pb-2">Event Log:</h4>
                                {log.map((l, i) => (
                                    <div key={i} className="text-sm">
                                        <span className="text-gray-500">Stage {l.stage}:</span> <span className="text-gray-300">{l.result}</span>
                                    </div>
                                ))}
                            </div>

                            <button onClick={resetGame} className="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded transition-colors">
                                Run Again
                            </button>
                        </Card>
                    </div>
                );
            }

            const current = scenarios[scenarioIndex];

            return (
                <div className="max-w-3xl mx-auto">
                    <div className="flex justify-between items-center mb-6 px-4">
                        <div className="text-sm font-mono text-gray-400">INCIDENT ID: 2025-RANSOM-AI</div>
                        <div className="flex gap-4">
                            <div className="flex items-center gap-2">
                                <Icon name="Activity" size={16} className={stats.integrity > 50 ? "text-green-500" : "text-red-500"} />
                                <span className="font-mono">{stats.integrity}%</span>
                            </div>
                        </div>
                    </div>

                    <Card className="mb-6 border-t-4 border-t-red-500">
                        <h3 className="text-xl font-bold text-white mb-2">{current.title}</h3>
                        <p className="text-gray-300 mb-6 leading-relaxed">{current.desc}</p>
                        
                        <div className="space-y-3">
                            {current.options.map((opt, idx) => (
                                <button 
                                    key={idx}
                                    onClick={() => handleOption(opt)}
                                    className="w-full text-left p-4 rounded bg-gray-800 hover:bg-gray-700 border border-gray-700 hover:border-blue-500 transition-all group"
                                >
                                    <div className="flex justify-between items-center">
                                        <span className="font-semibold text-gray-200 group-hover:text-white">{opt.label}</span>
                                        <Icon name="ChevronRight" size={16} className="text-gray-600 group-hover:text-blue-400" />
                                    </div>
                                </button>
                            ))}
                        </div>
                    </Card>
                    
                    <p className="text-center text-xs text-gray-600 uppercase tracking-widest">
                        Decision Node {scenarioIndex + 1} of {scenarios.length}
                    </p>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');

            return (
                <div className="min-h-screen pb-12 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">
                    <nav className="bg-gray-900 border-b border-gray-800 sticky top-0 z-50 backdrop-blur-md bg-opacity-80">
                        <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-red-600 p-1.5 rounded">
                                    <Icon name="Lock" className="text-white" size={20} />
                                </div>
                                <span className="font-bold text-white text-lg tracking-tight">RansomGuard <span className="text-red-500">AI</span></span>
                            </div>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => setActiveTab('dashboard')} 
                                    className={`px-4 py-2 rounded text-sm font-medium transition-colors ${activeTab === 'dashboard' ? 'bg-gray-800 text-white' : 'text-gray-400 hover:text-white'}`}
                                >
                                    Threat Intel
                                </button>
                                <button 
                                    onClick={() => setActiveTab('simulator')} 
                                    className={`px-4 py-2 rounded text-sm font-medium transition-colors ${activeTab === 'simulator' ? 'bg-red-600/20 text-red-400 border border-red-900' : 'text-gray-400 hover:text-white'}`}
                                >
                                    Simulation
                                </button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-6xl mx-auto px-4 py-8">
                        {activeTab === 'dashboard' ? <DashboardView /> : <SimulatorView />}
                    </main>

                    <footer className="border-t border-gray-800 mt-12 py-8 bg-gray-900/50">
                        <div className="max-w-6xl mx-auto px-4 text-center text-gray-600 text-sm">
                            <p>© 2025 Cyber Threat Intelligence Unit. Based on Q2 2025 Incident Reports.</p>
                            <p className="mt-2 text-xs">Tactics derived from: Check Point, Zscaler, Trend Micro, and Palo Alto Networks.</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
