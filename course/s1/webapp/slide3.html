<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Security - Unit 3</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        /* --- Specific Styling for Tables (Slide 3) --- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.9em;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        /* --- Question Slide --- */
        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        /* --- Controls Bar --- */
        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <!-- Image Area -->
        <div class="visual-container">
            <img id="slide-img" src="" alt="Presentation Visual">
        </div>

        <!-- Text Area (Right Side) -->
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
                <!-- Content injected via JS -->
            </div>

            <!-- Fixed Footnote -->
            <div class="slide-footer">
                Daily Cyber Security Essentials and Emergency Response
            </div>
        </div>
    </div>

    <!-- Navigation Controls -->
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; Previous</button>
        <span class="progress" id="slide-counter">1 / 11</span>
        <button id="nextBtn" onclick="changeSlide(1)">Next &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; Full Screen</button>
    </div>
</div>

<script>
    // --- Configuration ---
    // Note: Updated to 'p3-' for Unit 3 images
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p3-";
    
    // --- Slide Content Data ---
    const slides = [
        {
            id: 1,
            html: `
                <h1>Password Management & Multi-Factor Authentication</h1>
                <hr>
                <h3>The Keys to Your Digital Kingdom</h3>
                <p><strong>Unit 3</strong></p>
            `
        },
        {
            id: 2,
            html: `
                <h3>The Password Problem</h3>
                <ul>
                    <li>We forget them.</li>
                    <li>We make them too simple.</li>
                    <li><strong>We reuse them everywhere.</strong></li>
                </ul>
                <p>When one site gets hacked, criminals use your leaked password to try and log in to your email, bank, and social media.</p>
                <p style="background:#f8d7da; color:#721c24; padding:10px; border-radius:5px;"><strong>This is the #1 way accounts get stolen.</strong></p>
            `
        },
        {
            id: 3,
            html: `
                <h3>What Makes a Password STRONG?</h3>
                <table>
                    <tr>
                        <th>The OLD Way (Weak) &#128577;</th>
                        <th>The NEW Way (Strong) &#128512;</th>
                    </tr>
                    <tr>
                        <td><code>P@ssw0rd!</code></td>
                        <td><code>CorrectHorseBatteryStaple</code></td>
                    </tr>
                    <tr>
                        <td><code>Jsmith2024!</code></td>
                        <td><code>GreenCarpetSleepsLoudly</code></td>
                    </tr>
                    <tr>
                        <td>Short & Complex</td>
                        <td><strong>Long & Memorable</strong></td>
                    </tr>
                </table>
                <p><strong>Length is more important than complexity.</strong></p>
            `
        },
        {
            id: 4,
            html: `
                <h3>The Problem:</h3>
                <p>You can't remember dozens of long, unique passwords.</p>
                <hr>
                <h2>The Solution:</h2>
                <h1>You don't have to.</h1>
            `
        },
        {
            id: 5,
            html: `
                <h3>Use a Password Manager</h3>
                <p>A Password Manager is a secure, encrypted vault for all your passwords.</p>
                <ul>
                    <li>You only need to remember <strong>ONE</strong> very strong Master Password.</li>
                    <li>The manager does the rest.</li>
                </ul>
            `
        },
        {
            id: 6,
            html: `
                <h3>How Password Managers Help You</h3>
                <ul>
                    <li><strong>Generates</strong> super long, random passwords for every site.</li>
                    <li><strong>Remembers</strong> all of them for you securely.</li>
                    <li><strong>Auto-fills</strong> them when you log in.</li>
                    <li><strong>Bonus:</strong> Helps protect you from phishing sites!</li>
                </ul>
                <p><strong>Get Started with the one already on your phone!</strong> <br>(Google Password Manager / Apple Keychain)</p>
            `
        },
        {
            id: 7,
            html: `
                <h2>The Ultimate Upgrade</h2>
                <h1>Multi-Factor Authentication (MFA)</h1>
                <p><strong>What it is:</strong> Proof that it's really you logging in.</p>
                <ul>
                    <li><strong>Something you KNOW</strong> (your password)</li>
                    <li><strong>PLUS</strong></li>
                    <li><strong>Something you HAVE</strong> (your phone)</li>
                </ul>
            `
        },
        {
            id: 8,
            html: `
                <h3>Why You NEED MFA</h3>
                <p>Even if a criminal steals your password, they <strong>cannot</strong> get into your account because they don't have your phone.</p>
                <p style="background:#e8f4fc; padding:15px; border-radius:5px;">It is the <strong>single best thing</strong> you can do to protect your important accounts.</p>
            `
        },
        {
            id: 9,
            html: `
                <h3>Common Types of MFA</h3>
                <p><strong>Good: SMS / Text Message</strong><br>
                A code is texted to you. Better than nothing.</p>
                
                <p><strong>Better: Authenticator App</strong><br>
                An app on your phone (Google/Microsoft Authenticator) gives you a constantly changing code.</p>
                
                <p><strong>Best: Push Notification</strong><br>
                A simple "Yes, it's me" pop-up on your phone. Secure and easy.</p>
            `
        },
        {
            id: 10,
            html: `
                <h3>Your Action Plan</h3>
                <ol>
                    <li><strong>Enable MFA on your primary email account TODAY.</strong>
                        <br>Go to Security Settings and follow the instructions. Use an authenticator app if possible.
                    </li>
                    <br>
                    <li><strong>Start using a password manager.</strong>
                        <br>Begin with the one built into your browser or phone. Let it save your next new password.
                    </li>
                </ol>
            `
        },
        {
            id: 11,
            html: `
                <div class="question-slide">
                    <h1>Any Questions?</h1>
                    <hr>
                    <p>Thank you for listening!</p>
                    <p>The floor is now open for any questions regarding today's topics.</p>
                </div>
            `
        }
    ];

    // --- Logic ---
    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        
        // Image format: p3-1.jpg, p3-2.jpg, etc.
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;

        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; Exit Full Screen";
        } else {
            fsBtn.innerHTML = "&#9974; Full Screen";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
