<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網絡安全 - 第八課</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
            --danger-color: #e74c3c;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.9em;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .highlight-danger {
            color: var(--danger-color);
            font-weight: bold;
        }
        
        .step-box {
            background: #e8f4fc;
            border-left: 5px solid var(--accent-color);
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 0 5px 5px 0;
        }

        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <div class="visual-container">
            <img id="slide-img" src="" alt="簡報視覺圖示">
        </div>
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
            </div>
            <div class="slide-footer">
                第八課：日常網絡安全要點與應急響應
            </div>
        </div>
    </div>
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; 上一頁</button>
        <span class="progress" id="slide-counter">1 / 9</span>
        <button id="nextBtn" onclick="changeSlide(1)">下一頁 &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; 全螢幕</button>
    </div>
</div>

<script>
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p8-";
    
    const slides = [
        {
            id: 1,
            html: `
                <h1>網絡事件急救</h1>
                <hr>
                <h3>出咗事點算好</h3>
                <p><strong>第八課</strong></p>
            `
        },
        {
            id: 2,
            html: `
                <h3>事件應變嘅兩大黃金法則</h3>
                <table>
                    <tr>
                        <th width="50%" style="text-align:center; font-size:2em;">&#128524;</th> 
                        <th width="50%" style="text-align:center; font-size:2em;">&#128465; &#10060;</th> 
                    </tr>
                    <tr>
                        <td style="text-align:center;"><h2>1. 唔好驚。</h2><p>深呼吸。跟住程序做。</p></td>
                        <td style="text-align:center;"><h2>2. 唔好刪除任何嘢。</h2><p>刪除檔案或電郵會銷毀調查人員需要嘅證據。</p></td>
                    </tr>
                </table>
            `
        },
        {
            id: 3,
            html: `
                <h3>場景一：「我點咗個釣魚連結，仲入埋密碼！」</h3>
                
                <div class="step-box">
                    <strong>1. 改密碼</strong><br>
                    即刻去返<strong>真正</strong>嘅網站改密碼。喺其他你重用密碼嘅網站都要改。
                </div>
                
                <div class="step-box">
                    <strong>2. 報告</strong><br>
                    話俾你公司嘅 IT/保安部門知。如果係銀行密碼，打電話去銀行嘅防欺詐部門。
                </div>
                
                <div class="step-box">
                    <strong>3. 升級你嘅保安</strong><br>
                    開啟多重驗證 (MFA)。
                </div>
            `
        },
        {
            id: 4,
            html: `
                <h3>場景二：「我見到勒索軟件嘅訊息！」</h3>
                
                <div class="step-box" style="border-color: var(--danger-color);">
                    <strong class="highlight-danger">1. 隔離！</strong><br>
                    <strong>即刻斷開網絡連線。</strong>拔咗條網線或者熄咗 Wi-Fi。咁樣可以阻止佢擴散。
                </div>
                
                <div class="step-box">
                    <strong>2. 保持開機</strong><br>
                    <strong>唔好熄機。</strong>咁樣可以保存證據。
                </div>
                
                <div class="step-box">
                    <strong>3. 報告！</strong><br>
                    <strong>打電話</strong>俾你公司嘅 IT/保安部門。呢個係緊急情況。
                </div>
            `
        },
        {
            id: 5,
            html: `
                <h3>勒索軟件恢復</h3>
                <ul>
                    <li>你唯一安全嘅恢復選項係<strong>由乾淨嘅備份度還原</strong>。</li>
                    <li style="margin-top:20px; font-size:1.2em;" class="highlight-danger"><strong>唔好俾贖金。</strong></li>
                </ul>
                <div style="background:#f8d7da; border: 1px solid #f5c6cb; padding:15px; border-radius:5px; margin-top:10px;">
                    <ul>
                        <li>咁樣會資助犯罪活動。</li>
                        <li>亦都冇保證你攞得返啲檔案。</li>
                    </ul>
                </div>
            `
        },
        {
            id: 6,
            html: `
                <h3>場景三：「我啲資料喺數據外洩中洩漏咗。」</h3>
                
                <div class="step-box">
                    <strong>1. 換鎖</strong><br>
                    去返俾人入侵嘅網站<strong>改密碼</strong>。喺其他你重用密碼嘅地方都要改。
                </div>

                <div class="step-box">
                    <strong>2. 提高警覺</strong><br>
                    小心針對性嘅<strong>魚叉式釣魚</strong>電郵。罪犯會用你被偷嘅資料嚟對付你。
                </div>

                <div class="step-box">
                    <strong>3. 監察你嘅帳戶</strong><br>
                    檢查你嘅信用卡同銀行月結單，睇下有冇欺詐活動。
                </div>
            `
        },
        {
            id: 7,
            html: `
                <h3>喺公司報告事件係團隊運動</h3>
                <h2 style="color:var(--primary-color);">你唔係惹上麻煩。<br>你係幫緊成隊人。</h2>
                <hr>
                <p>隱瞞一個錯誤會令攻擊者造成更大嘅破壞。</p>
                <p><strong>快速、誠實咁報告安全問題。</strong></p>
            `
        },
        {
            id: 8,
            html: `
                <h3>你嘅行動計劃</h3>
                <ol>
                    <li><strong>搵出喺你公司發生安全事件時要聯絡邊個。</strong>
                        <br><em>係 IT 服務台？安全熱線？定係一個電郵地址？</em>
                    </li>
                    <br>
                    <li><strong>將聯絡資料儲存</strong>喺一個你容易搵到嘅地方。</li>
                </ol>
            `
        },
        {
            id: 9,
            html: `
                <div class="question-slide">
                    <h1>有問題嗎？</h1>
                    <hr>
                    <p>多謝收聽！</p>
                    <p>大家可以就今日嘅主題隨便發問。</p>
                </div>
            `
        }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;
        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; 離開全螢幕";
        } else {
            fsBtn.innerHTML = "&#9974; 全螢幕";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
