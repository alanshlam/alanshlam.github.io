<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 勒索軟體防禦訓練 2025</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Segoe UI', 'Microsoft JhengHei', '微軟正黑體', system-ui, sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        
        .glow-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .glow-red { text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        
        #error-box { display: none; padding: 20px; background: #ef4444; color: white; margin: 20px; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="error-box"></div>

    <div id="root" class="flex h-screen items-center justify-center">
        <div class="text-center animate-pulse">
            <div class="text-2xl font-bold text-red-500 mb-2 font-mono">正在初始化防禦系統...</div>
            <div class="text-slate-500 text-sm">正在載入模組...</div>
        </div>
    </div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const errorBox = document.getElementById('error-box');
            const root = document.getElementById('root');
            root.style.display = 'none';
            errorBox.style.display = 'block';
            errorBox.innerHTML = `<h3 class="font-bold">系統故障</h3><p>${message}</p><p>行號: ${lineno}</p>`;
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                Shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />,
                Alert: <g><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></g>,
                Zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />,
                Lock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>,
                Server: <g><rect x="2" y="2" width="20" height="8" rx="2" ry="2" /><rect x="2" y="14" width="20" height="8" rx="2" ry="2" /><line x1="6" y1="6" x2="6.01" y2="6" /><line x1="6" y1="18" x2="6.01" y2="18" /></g>,
                Dollar: <g><line x1="12" y1="1" x2="12" y2="23" /><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" /></g>,
                Activity: <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />,
                UserX: <g><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="8.5" cy="7" r="4" /><line x1="18" y1="8" x2="23" y2="13" /><line x1="23" y1="8" x2="18" y2="13" /></g>,
                ChevronRight: <polyline points="9 18 15 12 9 6" />
            };
            return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || <circle cx="12" cy="12" r="10" />}</svg>;
        };

        const Card = ({ children, className = "" }) => <div className={`bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-xl relative overflow-hidden ${className}`}>{children}</div>;

        const DashboardView = () => (
            <div className="space-y-6 animate-in fade-in duration-500">
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <Card className="border-red-900/30">
                        <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="Dollar" size={64} /></div>
                        <p className="text-gray-400 text-sm font-medium uppercase tracking-wider">平均支付贖金 (2025年第二季)</p>
                        <h3 className="text-3xl font-bold text-white mt-2 glow-text">113萬美元</h3>
                        <p className="text-xs text-red-400 mt-2 flex items-center gap-1"><Icon name="Activity" size={12} /> 高於2024年</p>
                    </Card>
                    <Card className="border-blue-900/30">
                        <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="Zap" size={64} /></div>
                        <p className="text-gray-400 text-sm font-medium uppercase tracking-wider">AI 採用率</p>
                        <h3 className="text-3xl font-bold text-white mt-2 glow-text">80%</h3>
                        <p className="text-xs text-blue-400 mt-2">的事件現已使用 AI</p>
                    </Card>
                    <Card className="border-yellow-900/30">
                        <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="Activity" size={64} /></div>
                        <p className="text-gray-400 text-sm font-medium uppercase tracking-wider">入侵速度</p>
                        <h3 className="text-3xl font-bold text-white mt-2">&lt; 25 分鐘</h3>
                        <p className="text-xs text-yellow-500 mt-2">橫向移動所需時間</p>
                    </Card>
                    <Card className="border-purple-900/30">
                        <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="Lock" size={64} /></div>
                        <p className="text-gray-400 text-sm font-medium uppercase tracking-wider">影響</p>
                        <h3 className="text-3xl font-bold text-white mt-2">76%</h3>
                        <p className="text-xs text-purple-400 mt-2">的組織防禦失敗</p>
                    </Card>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <Card className="lg:col-span-2">
                        <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                            <Icon name="Activity" className="text-red-500" /> 2025年攻擊鏈
                        </h3>
                        <div className="space-y-4">
                            {[
                                { step: "1. 存取", tool: "生成式AI語音釣魚", desc: "AI 語音複製欺騙服務台重設密碼。" },
                                { step: "2. 偵察", tool: "自動掃描器", desc: "AI 即時繪製關鍵資產地圖（醫療保健/能源節點）。" },
                                { step: "3. 惡意軟體", tool: "LLM 多態性", desc: "程式碼每次執行都會變異，以繞過防毒軟體簽名。" },
                                { step: "4. 勒索", tool: "Deepfake 威脅", desc: "AI 產生 CEO「承認」過失的影片以施壓付款。" }
                            ].map((item, idx) => (
                                <div key={idx} className="flex items-center gap-4 p-3 bg-gray-800/50 rounded-lg border border-gray-700 hover:border-blue-500 transition-colors">
                                    <div className="bg-blue-900/20 text-blue-400 px-3 py-1 rounded font-mono text-sm whitespace-nowrap">{item.step}</div>
                                    <div>
                                        <div className="text-white font-semibold">{item.tool}</div>
                                        <div className="text-gray-400 text-sm">{item.desc}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </Card>

                    <Card>
                        <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                            <Icon name="Shield" className="text-green-500" /> 防禦策略
                        </h3>
                        <div className="space-y-4 text-sm text-gray-300">
                            <p><strong className="text-white">技術層：</strong>部署 Agentic AI 防禦工具（例如 CrowdStrike）以機器人對抗機器人。</p>
                            <p><strong className="text-white">人為層：</strong>驗證所有緊急通話。如果 CEO 打電話要求匯款，掛斷電話再回撥。</p>
                            <p><strong className="text-white">備份：</strong>維護離線、不可變的備份。AI 無法加密它無法觸及的內容。</p>
                            <div className="mt-6 p-4 bg-red-900/20 border border-red-900 rounded">
                                <div className="text-red-400 font-bold text-xs uppercase mb-1">嚴重警告</div>
                                趨勢科技警告，「Agentic AI」將在 2026 年劫持 Windows 11 Copilot 功能。請立即修補。
                            </div>
                        </div>
                    </Card>
                </div>
            </div>
        );

        const SimulatorView = () => {
            const [gameState, setGameState] = useState('intro');
            const [scenarioIndex, setScenarioIndex] = useState(0);
            const [log, setLog] = useState([]);
            const [stats, setStats] = useState({ budget: 100, integrity: 100 });

            const scenarios = [
                {
                    title: "收到語音警報",
                    desc: "您的服務台回報接到一通自稱「CEO」的電話，要求緊急重設密碼以進行合併交易。聲音聽起來完美無瑕（音訊 Deepfake）。",
                    options: [
                        { label: "授權重設（他是 CEO！）", impact: { integrity: -50, budget: 0 }, result: "失敗。那是 AI 複製人。攻擊者現在擁有管理員權限。" },
                        { label: "透過秘密短語驗證", impact: { integrity: 0, budget: 0 }, result: "成功。來電者無法提供安全詞並掛斷電話。" },
                        { label: "忽略報告", impact: { integrity: -20, budget: 0 }, result: "有風險。攻擊者嘗試另一名員工並成功。" }
                    ]
                },
                {
                    title: "網路異常",
                    desc: "行為 AI 偵測到橫向移動。一台伺服器正在向未知 IP 傳送大量資料。可能是備份，也可能是資料外洩。",
                    options: [
                        { label: "自動隔離伺服器（AI 回應）", impact: { integrity: 0, budget: -10 }, result: "很好。您阻止了資料竊取。僅有少量停機成本。" },
                        { label: "手動調查", impact: { integrity: -30, budget: 0 }, result: "太慢了。在您檢查日誌時，500GB 的資料已被竊取。" }
                    ]
                },
                {
                    title: "勒索要求",
                    desc: "檔案已被加密。一個聊天機器人彈出：「我們有您的資料。支付 113 萬美元，否則我們將洩漏 CEO 的私人影片（Deepfakes）。」",
                    options: [
                        { label: "支付贖金", impact: { integrity: -10, budget: -100 }, result: "壞主意。他們拿了錢還要更多。解密失敗。" },
                        { label: "從離線備份還原", impact: { integrity: 0, budget: -20 }, result: "極好。系統在 6 小時內還原。零付款。" }
                    ]
                }
            ];

            const handleOption = (option) => {
                const newStats = {
                    budget: stats.budget + option.impact.budget,
                    integrity: stats.integrity + option.impact.integrity
                };
                setStats(newStats);
                setLog([...log, { stage: scenarioIndex + 1, choice: option.label, result: option.result }]);
                
                if (scenarioIndex < scenarios.length - 1) {
                    setScenarioIndex(scenarioIndex + 1);
                } else {
                    setGameState('end');
                }
            };

            const resetGame = () => {
                setGameState('intro');
                setScenarioIndex(0);
                setLog([]);
                setStats({ budget: 100, integrity: 100 });
            };

            if (gameState === 'intro') {
                return (
                    <div className="max-w-2xl mx-auto text-center pt-12">
                        <div className="inline-block p-4 rounded-full bg-red-900/30 mb-6 border border-red-500"><Icon name="Alert" size={48} className="text-red-500" /></div>
                        <h2 className="text-3xl font-bold text-white mb-4">CISO 危機模擬器</h2>
                        <p className="text-gray-400 mb-8 text-lg">您是資安長。現在是 2025 年。一個由 AI 驅動的勒索軟體集團「黃金國」正鎖定您的公司。做出正確的選擇以拯救公司。</p>
                        <button onClick={() => setGameState('playing')} className="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg hover:shadow-red-900/50 transition-all">開始模擬</button>
                    </div>
                );
            }

            if (gameState === 'end') {
                const survived = stats.integrity > 50 && stats.budget > 0;
                return (
                    <div className="max-w-2xl mx-auto pt-8">
                        <Card className={`text-center border-2 ${survived ? 'border-green-500' : 'border-red-500'}`}>
                            <h2 className={`text-3xl font-bold mb-2 ${survived ? 'text-green-500' : 'text-red-500'}`}>{survived ? "威脅已解除" : "系統已遭入侵"}</h2>
                            <p className="text-gray-400 mb-6">模擬完成</p>
                            
                            <div className="grid grid-cols-2 gap-4 mb-8">
                                <div className="bg-gray-900 p-4 rounded"><div className="text-sm text-gray-500">系統完整性</div><div className={`text-2xl font-bold ${stats.integrity > 50 ? 'text-green-400' : 'text-red-400'}`}>{stats.integrity}%</div></div>
                                <div className="bg-gray-900 p-4 rounded"><div className="text-sm text-gray-500">預算影響</div><div className="text-2xl font-bold text-white">{stats.budget <= 0 ? "破產" : "穩定"}</div></div>
                            </div>

                            <div className="text-left space-y-3 mb-8">
                                <h4 className="font-bold text-white border-b border-gray-700 pb-2">事件日誌：</h4>
                                {log.map((l, i) => (<div key={i} className="text-sm"><span className="text-gray-500">階段 {l.stage}:</span> <span className="text-gray-300">{l.result}</span></div>))}
                            </div>

                            <button onClick={resetGame} className="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded transition-colors">再玩一次</button>
                        </Card>
                    </div>
                );
            }

            const current = scenarios[scenarioIndex];

            return (
                <div className="max-w-3xl mx-auto">
                    <div className="flex justify-between items-center mb-6 px-4">
                        <div className="text-sm font-mono text-gray-400">事件 ID: 2025-RANSOM-AI</div>
                        <div className="flex gap-4">
                            <div className="flex items-center gap-2"><Icon name="Activity" size={16} className={stats.integrity > 50 ? "text-green-500" : "text-red-500"} /><span className="font-mono">{stats.integrity}%</span></div>
                        </div>
                    </div>

                    <Card className="mb-6 border-t-4 border-t-red-500">
                        <h3 className="text-xl font-bold text-white mb-2">{current.title}</h3>
                        <p className="text-gray-300 mb-6 leading-relaxed">{current.desc}</p>
                        
                        <div className="space-y-3">
                            {current.options.map((opt, idx) => (
                                <button key={idx} onClick={() => handleOption(opt)} className="w-full text-left p-4 rounded bg-gray-800 hover:bg-gray-700 border border-gray-700 hover:border-blue-500 transition-all group">
                                    <div className="flex justify-between items-center"><span className="font-semibold text-gray-200 group-hover:text-white">{opt.label}</span><Icon name="ChevronRight" size={16} className="text-gray-600 group-hover:text-blue-400" /></div>
                                </button>
                            ))}
                        </div>
                    </Card>
                    
                    <p className="text-center text-xs text-gray-600 uppercase tracking-widest">決策點 {scenarioIndex + 1} / {scenarios.length}</p>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            return (
                <div className="min-h-screen pb-12 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">
                    <nav className="bg-gray-900 border-b border-gray-800 sticky top-0 z-50 backdrop-blur-md bg-opacity-80">
                        <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-red-600 p-1.5 rounded"><Icon name="Lock" className="text-white" size={20} /></div>
                                <span className="font-bold text-white text-lg tracking-tight">勒索軟體防衛 <span className="text-red-500">AI</span></span>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 rounded text-sm font-medium transition-colors ${activeTab === 'dashboard' ? 'bg-gray-800 text-white' : 'text-gray-400 hover:text-white'}`}>威脅情報</button>
                                <button onClick={() => setActiveTab('simulator')} className={`px-4 py-2 rounded text-sm font-medium transition-colors ${activeTab === 'simulator' ? 'bg-red-600/20 text-red-400 border border-red-900' : 'text-gray-400 hover:text-white'}`}>模擬</button>
                            </div>
                        </div>
                    </nav>
                    <main className="max-w-6xl mx-auto px-4 py-8">
                        {activeTab === 'dashboard' ? <DashboardView /> : <SimulatorView />}
                    </main>
                    <footer className="border-t border-gray-800 mt-12 py-8 bg-gray-900/50">
                        <div className="max-w-6xl mx-auto px-4 text-center text-gray-600 text-sm">
                            <p>© 2025 網路威脅情報單位。基於 2025 年第二季事件報告。</p>
                            <p className="mt-2 text-xs">戰術源自：Check Point、Zscaler、Trend Micro 和 Palo Alto Networks。</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
