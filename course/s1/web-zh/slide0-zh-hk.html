<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日常網絡安全要點與應急響應 - 總覽</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        .lecture-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        .lecture-item {
            background: #f8f9fa;
            border-left: 4px solid var(--accent-color);
            padding: 10px;
            font-size: 0.9em;
        }

        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .lecture-grid {
                grid-template-columns: 1fr;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <div class="visual-container">
            <img id="slide-img" src="" alt="簡報視覺圖示">
        </div>

        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
                <!-- Content injected via JS -->
            </div>

            <div class="slide-footer">
                日常網絡安全要點與應急響應
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; 上一頁</button>
        <span class="progress" id="slide-counter">1 / 8</span>
        <button id="nextBtn" onclick="changeSlide(1)">下一頁 &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; 全螢幕</button>
    </div>
</div>

<script>
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p0-";
    
    const slides = [
        {
            id: 1,
            html: `
                <h1>日常網絡安全要點與應急響應</h1>
                <hr>
                <h2>課程總覽</h2>
                <p><strong>你的數碼安全路線圖</strong></p>
                <p>喺呢個10節課嘅課程入面，我哋會將你由一個易受攻擊嘅用戶，轉變成一個有能力嘅數碼捍衛者。</p>
            `
        },
        {
            id: 2,
            html: `
                <h3>單元一：基礎</h3>
                <p>我哋首先要理解我哋住喺一個點樣嘅「數碼房屋」，同埋點樣鎖好啲門。</p>
                <div class="lecture-grid">
                    <div class="lecture-item">
                        <strong>第一課：了解概況</strong><br>
                        保密性、完整性、可用性，同埋「數碼房屋」嘅類比。
                    </div>
                    <div class="lecture-item">
                        <strong>第二課：建立你嘅防禦</strong><br>
                        四大基本習慣：鎖、更新、安全軟件、同埋安全嘅應用程式。
                    </div>
                    <div class="lecture-item">
                        <strong>第三課：密碼與多重驗證 (MFA)</strong><br>
                        點解密碼會失效，同埋點解多重驗證係終極嘅鎖。
                    </div>
                </div>
            `
        },
        {
            id: 3,
            html: `
                <h3>單元二：安全上網習慣</h3>
                <p>點樣喺唔會俾人呃嘅情況下瀏覽互聯網同處理交易。</p>
                <div class="lecture-grid">
                    <div class="lecture-item">
                        <strong>第四課：安全瀏覽</strong><br>
                        識别假連結、理解 HTTPS，同埋使用 VPN。
                    </div>
                    <div class="lecture-item">
                        <strong>第五課：電郵與交易</strong><br>
                        識別魚叉式網絡釣魚，同埋點解信用卡比扣賬卡更安全。
                    </div>
                </div>
            `
        },
        {
            id: 4,
            html: `
                <h3>單元三：維護與恢復能力</h3>
                <p>確保你嘅裝置襟用，同埋你嘅資料喺災難中可以生存。</p>
                <div class="lecture-grid">
                    <div class="lecture-item">
                        <strong>第六課：更新與備份</strong><br>
                        3-2-1 備份策略，同埋點解更新係你免費嘅安全服務。
                    </div>
                </div>
                <p style="margin-top:20px;"><em>「更新係保養，備份係保險。」</em></p>
            `
        },
        {
            id: 5,
            html: `
                <h3>單元四：事故應對</h3>
                <p>了解威脅，同埋喺威脅發生時確切知道要做啲咩。</p>
                <div class="lecture-grid">
                    <div class="lecture-item">
                        <strong>第七課：威脅簡報</strong><br>
                        深入探討釣魚、勒索軟件同資料洩露。
                    </div>
                    <div class="lecture-item">
                        <strong>第八課：急救</strong><br>
                        黃金法則：唔好驚、唔好刪。逐步恢復指南。
                    </div>
                </div>
            `
        },
        {
            id: 6,
            html: `
                <h3>單元五：真實世界與未來</h3>
                <p>從歷史中學習，為人工智能時代做好準備。</p>
                <div class="lecture-grid">
                    <div class="lecture-item">
                        <strong>第九課：案例研究</strong><br>
                        分析 Target、Colonial Pipeline 同 Twitter 嘅黑客攻擊事件，學到真實教訓。
                    </div>
                    <div class="lecture-item">
                        <strong>第十課：人工智能與詐騙</strong><br>
                        語音複製、Deepfakes，同埋喺 AI 時代點樣驗證真偽。
                    </div>
                </div>
            `
        },
        {
            id: 7,
            html: `
                <h3>點解呢啲咁重要</h3>
                <h2 style="color:var(--primary-color);">安全唔係要你疑神疑鬼。</h2>
                <h2 style="color:var(--accent-color);">而係要你做好準備。</h2>
                <hr>
                <p>喺呢個課程完結之前，你將會有一個完整嘅<strong>行動計劃</strong>，嚟保護你自己、你嘅家人同你嘅工作場所。</p>
            `
        },
        {
            id: 8,
            html: `
                <div class="question-slide">
                    <h1>有冇問題？</h1>
                    <hr>
                    <p>我哋開始呢個旅程啦。</p>
                </div>
            `
        }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;

        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; 離開全螢幕";
        } else {
            fsBtn.innerHTML = "&#9974; 全螢幕";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
