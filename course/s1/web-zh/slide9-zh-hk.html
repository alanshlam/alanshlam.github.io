<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網絡安全 - 第九課</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
            --danger-color: #e74c3c;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        .step-box {
            background: #e8f4fc;
            border-left: 5px solid var(--accent-color);
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 0 5px 5px 0;
            font-size: 0.95em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.9em;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <div class="visual-container">
            <img id="slide-img" src="" alt="簡報視覺圖示">
        </div>
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
            </div>
            <div class="slide-footer">
                日常網絡安全要點與應急響應
            </div>
        </div>
    </div>
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; 上一頁</button>
        <span class="progress" id="slide-counter">1 / 12</span>
        <button id="nextBtn" onclick="changeSlide(1)">下一頁 &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; 全螢幕</button>
    </div>
</div>

<script>
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p9-";
    
    const slides = [
        {
            id: 1,
            html: `
                <h1>案例討論與分析</h1>
                <hr>
                <h3>真實世界嘅安全事件</h3>
                <p><strong>第九課</strong></p>
            `
        },
        {
            id: 2,
            html: `
                <h3>案例一：Target 數據外洩 (2013)</h3>
                <h2 style="color:var(--primary-color);"><strong>故事：</strong></h2>
                <p>節日購物季期間，四千萬張客戶信用卡資料被盜。</p>
                <hr>
                <h2 style="color:var(--danger-color);"><strong>原因：</strong></h2>
                <p>一封釣魚郵件。</p>
            `
        },
        {
            id: 3,
            html: `
                <h3>Target 數據外洩係點樣發生嘅</h3>
                <div class="step-box">
                    <strong>1. 釣魚郵件</strong><br>
                    寄俾一個第三方嘅 HVAC (暖通空調) 承辦商。
                </div>
                <div class="step-box">
                    <strong>2. 密碼被盜</strong><br>
                    承辦商登入 Target 網絡嘅密碼被偷。
                </div>
                <div class="step-box">
                    <strong>3. 網絡被入侵</strong><br>
                    黑客由 HVAC 系統轉移到 Target 嘅主網絡。
                </div>
                <div class="step-box">
                    <strong>4. 收銀系統被植入惡意軟件</strong><br>
                    黑客喺碌卡嘅時候偷取信用卡號碼。
                </div>
            `
        },
        {
            id: 4,
            html: `
                <h3>由 Target 事件學到嘅教訓</h3>
                <h2 style="color:var(--primary-color);"><strong>你嘅安全程度取決於你最弱嘅一環。</strong></h2>
                <p style="margin-top:20px;">一個針對睇落唔重要嘅合作夥伴嘅簡單釣魚攻擊，就導致咗一場災難性嘅數據外洩。每個人都係目標。</p>
            `
        },
        {
            id: 5,
            html: `
                <h3>案例二：Colonial Pipeline 勒索軟件攻擊 (2021)</h3>
                <h2 style="color:var(--primary-color);"><strong>故事：</strong></h2>
                <p>美國最大嘅燃油管道因為勒索軟件而關閉，導致東岸大範圍出現短缺。</p>
                <hr>
                <h2 style="color:var(--danger-color);"><strong>原因：</strong></h2>
                <p>一個被盜嘅密碼。</p>
            `
        },
        {
            id: 6,
            html: `
                <h3>條油管係點樣被黑嘅</h3>
                <div class="step-box">
                    <strong>1. 發現</strong><br>
                    黑客喺暗網搵到一個有效嘅員工密碼。
                </div>
                <div class="step-box">
                    <strong>2. 存取</strong><br>
                    佢哋用嚟登入公司嘅遠程存取 <strong>VPN</strong>。
                </div>
                <div class="step-box" style="border-color:var(--danger-color);">
                    <strong>3. 失誤</strong><br>
                    個帳戶<strong>冇啟用 MFA (多重驗證)。</strong>攻擊者就咁樣大搖大擺行咗入去。
                </div>
            `
        },
        {
            id: 7,
            html: `
                <h3>由 Colonial Pipeline 事件學到嘅教訓</h3>
                <p>呢場全國性嘅危機，本來可以靠一樣嘢就避免到：</p>
                <h1 style="color:var(--accent-color); font-size:2.5em; margin:20px 0;">多重驗證 (MFA)</h1>
                <p><strong>佢唔係可有可無，而係必需。</strong></p>
            `
        },
        {
            id: 8,
            html: `
                <h3>案例三：Twitter「比特幣騙局」(2020)</h3>
                <h2 style="color:var(--primary-color);"><strong>故事：</strong></h2>
                <p>政客同名人嘅帳戶被入侵，用嚟發佈加密貨幣騙局嘅推文。</p>
                <hr>
                <h2 style="color:var(--danger-color);"><strong>原因：</strong></h2>
                <p>呃啲人。</p>
            `
        },
        {
            id: 9,
            html: `
                <h3>Twitter 帳戶係點樣被入侵嘅</h3>
                <p>呢次係<strong>社交工程攻擊。</strong></p>
                <div class="step-box">
                    <strong>1. 打電話</strong><br>
                    攻擊者<strong>打電話</strong>俾 Twitter 員工。
                </div>
                <div class="step-box">
                    <strong>2. 扮鬼扮馬</strong><br>
                    佢哋扮係內部 IT 服務台嘅人。
                </div>
                <div class="step-box">
                    <strong>3. 呃人</strong><br>
                    佢哋呃啲員工交出內部工具嘅密碼。
                </div>
            `
        },
        {
            id: 10,
            html: `
                <h3>由 Twitter 事件學到嘅教訓</h3>
                <h2 style="color:var(--primary-color);"><strong>你係最後一道防線。</strong></h2>
                <p style="margin-top:20px;">最強嘅技術保安都可以透過呃一個人嚟繞過。</p>
                <p style="background:#e8f4fc; padding:15px; border-radius:5px; margin-top:15px;"><strong>對唔尋常或者緊急嘅要求保持懷疑，就算睇落係嚟自公司內部都係一樣。</strong></p>
            `
        },
        {
            id: 11,
            html: `
                <h3>教訓總結</h3>
                <table>
                    <tr>
                        <th width="30%">案例</th>
                        <th width="30%">失誤之處</th>
                        <th width="40%">學到嘅教訓</th>
                    </tr>
                    <tr>
                        <td><strong>Target</strong></td>
                        <td>釣魚郵件</td>
                        <td>每個人都係目標。</td>
                    </tr>
                    <tr>
                        <td><strong>Colonial Pipeline</strong></td>
                        <td>冇 MFA</td>
                        <td>MFA 唔係可有可無。</td>
                    </tr>
                    <tr>
                        <td><strong>Twitter</strong></td>
                        <td>社交工程</td>
                        <td>人先係目標。</td>
                    </tr>
                </table>
                <p style="margin-top:20px;"><strong>我哋喺呢個課程學到嘅基礎知識，本來可以阻止晒所有呢啲事件。</strong></p>
            `
        },
        {
            id: 12,
            html: `
                <div class="question-slide">
                    <h1>有問題嗎？</h1>
                    <hr>
                    <p>多謝收聽！</p>
                    <p>大家可以就今日嘅主題隨便發問。</p>
                </div>
            `
        }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;
        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; 離開全螢幕";
        } else {
            fsBtn.innerHTML = "&#9974; 全螢幕";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
