<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網路安全 - 第七單元</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.9em;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {

        /* --- Mobile Scrolling & Layout Fix --- */
        body {
            display: block; /* Allow natural page scrolling instead of flex centering */
            padding: 15px 0;
            align-items: normal; /* Override centering */
            justify-content: normal;
        }
        .container {
            width: 100%;
            max-height: none; /* Remove fixed height that prevents scrolling */
            height: auto;
            overflow: visible; /* Show all content */
            margin: 0;
            border-radius: 0;
            box-shadow: none;
        }
        .slide-content {
            min-height: unset; /* Let content determine its own height */
            overflow: visible;
        }
        .dynamic-content {
            overflow-y: visible; /* Disable the internal scroll area to let the page scroll */
        }
        h1 { font-size: 1.8em; }
        .controls {
            position: sticky;
            bottom: 0;
            border-top: 1px solid #ccc;
        }
        .controls button {
            padding: 12px 14px;
            min-height: 44px;
        }
        /* --- End Mobile Fix --- */
    
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <div class="visual-container">
            <img id="slide-img" src="" alt="簡報視覺圖示">
        </div>
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
            </div>
            <div class="slide-footer">
                第七單元：日常網路安全要點與應急響應
            </div>
        </div>
    </div>
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; 上一頁</button>
        <span class="progress" id="slide-counter">1 / 11</span>
        <button id="nextBtn" onclick="changeSlide(1)">下一頁 &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; 全螢幕</button>
    </div>
</div>

<script>
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p7-";
    
    const slides = [
        {
            id: 1,
            html: `
                <h1>常見網路事件</h1>
                <hr>
                <h3>威脅簡報</h3>
                <p><strong>第七單元</strong></p>
            `
        },
        {
            id: 2,
            html: `
                <h3>什麼是安全事件？</h3>
                <p>一個您資訊安全受到威脅的事件。</p>
                <ol>
                    <li><strong>釣魚攻擊</strong> (欺騙)</li>
                    <li><strong>勒索軟體攻擊</strong> (中斷)</li>
                    <li><strong>資料洩漏 / 外洩</strong> (竊盜)</li>
                </ol>
            `
        },
        {
            id: 3,
            html: `
                <h3>事件 #1：釣魚攻擊</h3>
                <p><strong>目標：</strong>竊取您的登入憑證。</p>
                <p><strong>運作方式：</strong></p>
                <ol>
                    <li><strong>誘餌：</strong>傳送一封帶有假登入連結的欺騙性電子郵件。</li>
                    <li><strong>錯誤：</strong>您點擊連結並在假網站上輸入您的使用者名稱和密碼。</li>
                    <li><strong>事件：</strong>攻擊者獲取您的憑證並劫持您的真實帳戶。</li>
                </ol>
            `
        },
        {
            id: 4,
            html: `
                <h3>事件 #2：勒索軟體攻擊</h3>
                <p><strong>目標：</strong>將您的檔案作為人質以勒索金錢。</p>
                <p><strong>運作方式：</strong></p>
                <ol>
                    <li><strong>入口：</strong>您開啟一個惡意的電子郵件附件。</li>
                    <li><strong>感染：</strong>勒索軟體悄悄安裝並開始加密您的檔案。</li>
                    <li><strong>危機：</strong>出現一張勒索訊息。您所有的資料都被鎖定。</li>
                </ol>
            `
        },
        {
            id: 5,
            html: `
                <h3>勒索軟體的影響</h3>
                <table style="text-align:center;">
                    <tr>
                        <th style="text-align:center; padding:20px;">&#127981;<br>營運中斷</th>
                        <th style="text-align:center; padding:20px;">&#128274;<br>資料無法存取</th>
                        <th style="text-align:center; padding:20px;">&#128184;<br>重大財務損失</th>
                    </tr>
                </table>
                <h2 style="margin-top:20px;"><strong>備份是您的第一道防線。</strong></h2>
            `
        },
        {
            id: 6,
            html: `
                <h3>事件 #3：資料洩漏 / 外洩</h3>
                <p><strong>目標：</strong>大量竊取敏感資訊。</p>
                <p><strong>這是什麼：</strong>您的個人資料（電子郵件、密碼、信用卡資訊）從公司的資料庫中被竊取。</p>
                <p><strong>如何發生：</strong>駭客攻擊、密碼被盜，甚至只是意外。</p>
            `
        },
        {
            id: 7,
            html: `
                <h3>為什麼您應該關心資料外洩？</h3>
                <p>您洩漏的密碼將被罪犯用來嘗試存取您的<strong>其他</strong>帳戶。</p>
                <div style="background:#e8f4fc; padding:15px; border-radius:5px; margin:15px 0;">
                    <strong>這稱為「憑證填充攻擊」。</strong>
                </div>
                <p>它依賴於人們<strong>重複使用密碼</strong>的事實。</p>
            `
        },
        {
            id: 8,
            html: `
                <h3>您是否曾被資料外洩波及？</h3>
                <p>您可以檢查您的電子郵件地址是否曾在已知的資料外洩事件中曝光。</p>
                <p>請造訪這個免費、安全且信譽良好的網站：</p>
                <h2><a href="https://haveibeenpwned.com" target="_blank">haveibeenpwned.com</a></h2>
            `
        },
        {
            id: 9,
            html: `
                <h3>事件摘要</h3>
                <table>
                    <tr>
                        <th>事件</th>
                        <th>是對...的攻擊</th>
                    </tr>
                    <tr>
                        <td><strong>釣魚</strong></td>
                        <td>您的信任 (欺騙)</td>
                    </tr>
                    <tr>
                        <td><strong>勒索軟體</strong></td>
                        <td>您的存取權 (中斷)</td>
                    </tr>
                    <tr>
                        <td><strong>資料洩漏</strong></td>
                        <td>您的資訊 (竊盜)</td>
                    </tr>
                </table>
            `
        },
        {
            id: 10,
            html: `
                <h3>下次...</h3>
                <h1><strong>當事件發生時該怎麼辦。</strong></h1>
            `
        },
        {
            id: 11,
            html: `
                <div class="question-slide">
                    <h1>有任何問題嗎？</h1>
                    <hr>
                    <p>感謝您的聆聽！</p>
                    <p>現在開放問答時間，歡迎針對今天的議題提問。</p>
                </div>
            `
        }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;
        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; 離開全螢幕";
        } else {
            fsBtn.innerHTML = "&#9974; 全螢幕";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
