<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日常生活中的網絡安全</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        .fake-email {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            margin: 15px 0;
        }

        .ransomware-alert {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            margin: 15px 0;
            text-align: center;
        }

        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50;
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <div class="visual-container">
            <img id="slide-img" src="" alt="簡報視覺圖示">
        </div>
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
            </div>
            <div class="slide-footer">
                第一課：日常網絡安全要點與應急響應
            </div>
        </div>
    </div>
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; 上一頁</button>
        <span class="progress" id="slide-counter">1 / 11</span>
        <button id="nextBtn" onclick="changeSlide(1)">下一頁 &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; 全螢幕</button>
    </div>
</div>

<script>
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p1-";
    
    const slides = [
        {
            id: 1,
            html: `
                <h1>日常生活中的網絡安全</h1>
                <hr>
                <h2>第一課：了解基本環境</h2>
                <p><strong>保護你數碼家園的指南。</strong></p>
            `
        },
        {
            id: 2,
            html: `
                <h2>今日議程</h2>
                <p><strong>第一課：了解基本環境</strong></p>
                <ul>
                    <li>什麼是網絡安全？</li>
                    <li>「數碼房屋」類比</li>
                    <li>常見風險：釣魚、惡意軟件等等</li>
                </ul>
            `
        },
        {
            id: 3,
            html: `
                <h1>第一課：網絡安全概念與常見風險</h1>
                <hr>
                <p>我哋深入探討核心概念。</p>
            `
        },
        {
            id: 4,
            html: `
                <h3>將安全想像成一間屋</h3>
                <ul>
                    <li><strong>你的裝置</strong> 就係你間屋。</li>
                    <li><strong>你的資訊</strong> (數據) 就係你嘅貴重物品。</li>
                    <li><strong>互聯網</strong> 就係你住嘅社區。</li>
                </ul>
                <p style="background:#e8f4fc; padding:10px; border-radius:5px;"><strong>網絡安全就係你點樣鎖好你數碼世界嘅門窗。</strong></p>
            `
        },
        {
            id: 5,
            html: `
                <h3>我哋要保護啲咩？三大支柱</h3>
                <ol>
                    <li><strong>保密性 (保守秘密)</strong>
                        <br>確保只有授權嘅人先可以睇到你嘅資訊。
                    </li>
                    <li><strong>完整性 (保持真實)</strong>
                        <br>確保你嘅資訊未經許可唔會被更改。
                    </li>
                    <li><strong>可用性 (保持運作)</strong>
                        <br>確保你喺需要嘅時候可以存取到你嘅資訊。
                    </li>
                </ol>
            `
        },
        {
            id: 6,
            html: `
                <h2>常見風險 #1：網絡釣魚 (Phishing)</h2>
                <p><em>(扮嘢專家)</em></p>
                <ul>
                    <li><strong>係咩嚟：</strong>一種呃你交出密碼或者財務資料嘅騙局。</li>
                    <li><strong>點樣運作：</strong>一封假扮嚟自你信賴公司（例如你嘅銀行、Netflix、Microsoft）嘅假電郵或短訊。</li>
                    <li><strong>目標：</strong>引你點擊一個連結，然後喺一個假網站輸入你嘅登入資料。</li>
                </ul>
            `
        },
        {
            id: 7,
            html: `
                <h3>釣魚郵件例子</h3>
                <div class="fake-email">
                    <p><strong>寄件人：</strong> Netfl1x-support@some-random-domain.com</p>
                    <p><strong>主旨：</strong> 緊急！你的帳戶已被暫停</p>
                    <hr>
                    <p>「親愛嘅顧客，<br>
                    我哋無法處理你上一筆付款。請更新你嘅資料以避免帳戶被暫停。請點擊此處：[連結到一個假網站]」</p>
                </div>
                <p style="color:red;"><strong>警號：營造緊迫感、通用稱呼、奇怪嘅寄件人電郵地址。</strong></p>
            `
        },
        {
            id: 8,
            html: `
                <h2>常見風險 #2：惡意軟件 (Malware)</h2>
                <p><em>(惡意嘅軟件)</em></p>
                <p><strong>專門設計嚟損害你電腦或偷你資料嘅軟件。</strong></p>
                <ul>
                    <li><strong>病毒：</strong>感染檔案，並喺電腦之間傳播。</li>
                    <li><strong>勒索軟件：</strong>鎖住你嘅檔案，然後要求你俾錢（贖金）先可以解鎖。</li>
                </ul>
            `
        },
        {
            id: 9,
            html: `
                <h3>勒索軟件例子</h3>
                <div class="ransomware-alert">
                    <p>你嘅檔案已經被加密！</p>
                </div>
                <p>「你所有嘅相片、文件同影片都已經被鎖住。要攞返解鎖嘅密鑰，你必須喺72小時內將價值500美元嘅比特幣傳送到呢個地址。過咗時限，你嘅檔案將會被永久刪除。」</p>
            `
        },
        {
            id: 10,
            html: `
                <h2>其他常見風險</h2>
                
                <h3>弱密碼</h3>
                <ul>
                    <li>容易估到嘅密碼，例如 <code>123456</code> 或者 <code>password</code>。</li>
                    <li>黑客會用電腦每秒撞幾十億個密碼。</li>
                    <li><strong>喺所有地方用同一個密碼係極大風險！</strong></li>
                </ul>

                <h3>唔安全嘅 Wi-Fi</h3>
                <ul>
                    <li>喺咖啡店、機場等地方嘅免費開放 Wi-Fi。</li>
                    <li>喺同一個網絡上嘅不法之徒可以「竊聽」並偷取你嘅資訊。</li>
                </ul>
            `
        },
        {
            id: 11,
            html: `
                <div class="question-slide">
                    <h1>有問題嗎？</h1>
                    <hr>
                    <p>多謝收聽！</p>
                    <p>大家可以就今日嘅主題隨便發問。</p>
                </div>
            `
        }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;
        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(`嘗試啟用全螢幕模式時出錯： ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; 離開全螢幕";
        } else {
            fsBtn.innerHTML = "&#9974; 全螢幕";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);
</script>

</body>
</html>
