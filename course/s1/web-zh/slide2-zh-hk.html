<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網絡安全 - 第二課</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        .checklist-box {
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent-color);
            margin-right: 15px;
            border-radius: 4px;
        }

        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <div class="visual-container">
            <img id="slide-img" src="" alt="簡報視覺圖示">
        </div>
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
            </div>
            <div class="slide-footer">
                第二課：日常網絡安全要點與應急響應
            </div>
        </div>
    </div>
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; 上一頁</button>
        <span class="progress" id="slide-counter">1 / 11</span>
        <button id="nextBtn" onclick="changeSlide(1)">下一頁 &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; 全螢幕</button>
    </div>
</div>

<script>
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p2-";
    
    const slides = [
        {
            id: 1,
            html: `
                <h1>日常生活中的網絡安全</h1>
                <hr>
                <h2>第二課：建立你的防禦</h2>
                <p><strong>第二部分：保護你裝置安全的基本習慣。</strong></p>
            `
        },
        {
            id: 2,
            html: `
                <h2>今日議程</h2>
                <p><strong>第二課：建立你的防禦</strong></p>
                <ul>
                    <li>四大基本安全習慣</li>
                    <li>保護你的電腦和智能手機</li>
                    <li>一個讓你安全的簡單清單</li>
                </ul>
            `
        },
        {
            id: 3,
            html: `
                <h1>第二課：保護裝置的基本方法</h1>
                <hr>
                <p>從了解風險，到建立你的防禦。</p>
            `
        },
        {
            id: 4,
            html: `
                <h3>從風險到防禦</h3>
                <p>上次我哋見識過「壞人」。今次，我哋嚟建立防禦。</p>
                <p><strong>適用於所有裝置嘅四大基本習慣：</strong></p>
                <ol>
                    <li>使用高強度螢幕鎖</li>
                    <li>保持軟件更新</li>
                    <li>使用安全軟件</li>
                    <li>精明使用應用程式</li>
                </ol>
            `
        },
        {
            id: 5,
            html: `
                <h3>習慣一：使用高強度螢幕鎖</h3>
                <p>呢個係你數碼世界嘅大門。記得鎖好！</p>
                <ul>
                    <li><strong>使用生物識別：</strong>Face ID 或指紋最好。</li>
                    <li><strong>使用良好嘅 PIN/密碼：</strong>
                        <ul>
                            <li><strong>6位數</strong>比4位數強100倍。</li>
                            <li>避免使用明顯嘅日期或順序。</li>
                        </ul>
                    </li>
                    <li><strong>啟用自動鎖定：</strong>設定螢幕喺1-5分鐘冇活動後自動鎖定。</li>
                </ul>
            `
        },
        {
            id: 6,
            html: `
                <h3>習慣二：保持軟件更新</h3>
                <p>更新會喺罪犯利用保安漏洞之前將佢哋修補好。</p>
                <div style="background:#e8f4fc; padding:15px; border-radius:5px; margin: 15px 0;">
                    <strong>黃金法則：開啟自動更新！</strong>
                </div>
                <ul>
                    <li>呢個係你可以做嘅最重要「設定一次就唔使理」嘅動作。</li>
                    <li>適用於你手機嘅操作系統（iOS/Android）、電腦嘅操作系統（Windows/Mac）同你嘅應用程式。</li>
                </ul>
            `
        },
        {
            id: 7,
            html: `
                <h3>習慣三：使用安全軟件</h3>
                <p>你嘅數碼看門狗，時刻警惕威脅。</p>
                <ul>
                    <li><strong>電腦：</strong>內置嘅工具已經好正！
                        <ul>
                            <li><strong>Windows 安全中心 (Defender)</strong> 預設開啟，而且非常出色。</li>
                            <li><strong>macOS</strong> 亦有強大嘅內置保護。</li>
                        </ul>
                    </li>
                    <li><strong>智能手機：</strong>你唔需要額外嘅防毒軟件，<strong>只要</strong>你堅持用官方應用程式商店。</li>
                </ul>
            `
        },
        {
            id: 8,
            html: `
                <h3>習慣四：精明使用應用程式</h3>
                <p>惡意軟件最容易嘅入侵方式，就係你邀請佢入嚟。</p>
                <ul>
                    <li><strong>堅持只用官方應用程式商店。</strong>
                        <br>（Apple App Store 同 Google Play Store）
                    </li>
                    <li><strong>檢查應用程式權限：</strong> 
                        <br>嗰個簡單遊戲<em>真係</em>需要存取你嘅聯絡人同咪高峰咩？如果覺得唔妥，就拒絕權限。
                    </li>
                </ul>
            `
        },
        {
            id: 9,
            html: `
                <h3>救命貼士：啟用「尋找我的裝置」</h3>
                <p>如果手機唔見咗或者被偷，呢個就係你嘅遙控器。</p>
                <ul>
                    <li><strong>定位：</strong>喺地圖上睇到你裝置嘅位置。</li>
                    <li><strong>鎖定：</strong>遠程鎖機，冇人可以用到。</li>
                    <li><strong>清除：</strong>作為最後手段，清除所有資料嚟保護你嘅私隱。</li>
                </ul>
                <p><strong>行動：確保你嘅智能手機已經啟用咗呢個功能！</strong></p>
            `
        },
        {
            id: 10,
            html: `
                <h3>你嘅安全檢查清單</h3>
                <p>為你嘅電腦同智能手機問下呢啲問題：</p>
                
                <div class="checklist-item"><div class="checklist-box"></div> 上面有冇高強度嘅鎖？</div>
                <div class="checklist-item"><div class="checklist-box"></div> 有冇設定自動更新？</div>
                <div class="checklist-item"><div class="checklist-box"></div> 我係咪只係由官方商店下載？</div>
                <div class="checklist-item"><div class="checklist-box"></div> 「尋找我的裝置」有冇開著？</div>
            `
        },
        {
            id: 11,
            html: `
                <div class="question-slide">
                    <h1>有問題嗎？</h1>
                    <hr>
                    <p>多謝收聽！</p>
                    <p>大家可以就今日嘅主題隨便發問。</p>
                </div>
            `
        }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;
        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; 離開全螢幕";
        } else {
            fsBtn.innerHTML = "&#9974; 全螢幕";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
