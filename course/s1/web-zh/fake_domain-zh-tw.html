<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>釣魚網域獵人 v2.1</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            text-align: center;
        }

        h1 { margin-bottom: 0.5rem; color: var(--primary); }
        .subtitle { color: #6b7280; margin-bottom: 2rem; }

        .progress-container {
            width: 100%;
            background-color: #e5e7eb;
            border-radius: 999px;
            height: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            background: #f9fafb;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 2rem;
            font-weight: 600;
            border: 1px solid #e5e7eb;
        }

        .question-area { margin-bottom: 2rem; }
        .instruction { font-size: 1.2rem; margin-bottom: 1.5rem; }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        button.domain-btn {
            background: white;
            border: 2px solid #e5e7eb;
            padding: 1.5rem;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Courier New', Courier, monospace; 
            word-break: break-all;
            color: #374151;
            font-weight: 600;
        }

        button.domain-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #eef2ff;
            transform: translateY(-2px);
        }

        button.domain-btn:disabled { cursor: not-allowed; opacity: 0.7; }

        .result-correct { border-color: var(--success) !important; background-color: #dcfce7 !important; color: var(--success) !important; }
        .result-wrong { border-color: var(--danger) !important; background-color: #fee2e2 !important; color: var(--danger) !important; }

        .info-box {
            display: none; 
            text-align: left;
            margin-top: 2rem;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
            animation: fadeIn 0.5s;
            background: #f9fafb;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .info-header {
            padding: 1rem;
            color: white;
            font-weight: bold;
            text-align: center;
        }
        .header-correct { background-color: var(--success); }
        .header-wrong { background-color: var(--danger); }

        .info-content { padding: 1.5rem; }
        .info-label { font-weight: bold; color: #6b7280; font-size: 0.85rem; text-transform: uppercase; margin-top: 12px; display: block;}
        .info-text { margin: 4px 0 0 0; color: #1f2937; }

        .action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            margin-top: 1.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover { background-color: #4338ca; }

        #finalScreen { display: none; }
        .score-circle {
            width: 140px;
            height: 140px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 auto 2rem auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .summary-container {
            text-align: left;
            margin-top: 2rem;
            border-top: 2px solid #e5e7eb;
            padding-top: 2rem;
        }
        
        .summary-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border-left: 6px solid #ccc;
            font-size: 0.95rem;
        }

        .summary-card.summary-win { border-left-color: var(--success); }
        .summary-card.summary-loss { border-left-color: var(--danger); }

        .summary-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .summary-fake-url {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .tag-correct { color: var(--success); font-weight: bold; font-size: 0.8rem; text-transform: uppercase; background: #dcfce7; padding: 2px 8px; border-radius: 4px; }
        .tag-wrong { color: var(--danger); font-weight: bold; font-size: 0.8rem; text-transform: uppercase; background: #fee2e2; padding: 2px 8px; border-radius: 4px; }

        .summary-details { color: #4b5563; font-size: 0.9rem; line-height: 1.4; }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            .container { padding: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎣 釣魚網域獵人</h1>
        
        <div id="gameScreen">
            <p class="subtitle">從更新的資料集中識別假網域</p>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="stats">
                <span id="scoreDisplay">分數：0</span>
                <span id="qCountDisplay">問題：1 / 10</span>
            </div>

            <div class="question-area">
                <p class="instruction">選擇<strong>假的</strong>網域：</p>
                <div class="options-grid" id="optionsContainer">
                    <button class="domain-btn" id="btn1" onclick="handleChoice(0)"></button>
                    <button class="domain-btn" id="btn2" onclick="handleChoice(1)"></button>
                </div>
            </div>

            <div id="resultArea" class="info-box">
                <div id="resultHeader" class="info-header"></div>
                <div class="info-content">
                    <span class="info-label">合法網域</span>
                    <p class="info-text" id="realDomainDisplay"></p>
                    <span class="info-label">變異類型</span>
                    <p class="info-text" id="spoofTypeDisplay"></p>
                    <span class="info-label">情境 / 攻擊細節</span>
                    <p class="info-text" id="contextDisplay"></p>
                    <div style="text-align: center;">
                        <button class="action-btn" id="nextBtn" onclick="nextQuestion()">下一題 ➡️</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="finalScreen">
            <div class="score-circle" id="finalScoreDisplay">0%</div>
            <h2>訓練完成！</h2>
            <p id="finalMessage">您正確識別了 Y 個釣魚網域中的 X 個。</p>
            
            <button class="action-btn" onclick="initGame()">重新訓練 🔄</button>

            <div class="summary-container">
                <h3 style="color: #4b5563;">📋 本次總結與攻擊情報</h3>
                <div id="summaryList"></div>
            </div>
        </div>
    </div>

    <script>
        const rawData = [
            { fake: "goggle.com", real: "google.com", type: "新增 'g'", context: "2006年著名的釣魚網站，會下載惡意軟體；最早期的知名案例之一。" },
            { fake: "gooogle.com", real: "google.com", type: "新增 'o'", context: "常用於釣魚和廣告獲利的變體；在多個活動中成為目標。" },
            { fake: "gogle.com", real: "google.com", type: "省略 'o'", context: "字元省略；重新導向至惡意網站或廣告。" },
            { fake: "paypa1.com", real: "paypal.com", type: "'1' 取代 'l'", context: "憑證竊取釣魚；典型的替換攻擊。" },
            { fake: "amazan.com", real: "amazon.com", type: "省略 'o'", context: "重新導向至充滿廣告的頁面並安裝可能不需要的程式 (PUP)。" },
            { fake: "offlice365.com", real: "office365.com", type: "新增 'f'", context: "託管偽造的 Microsoft 登入頁面以進行憑證收集 (2024–2025)。" },
            { fake: "micrsoft.com", real: "microsoft.com", type: "調換 'o' 和 's'", context: "用於企業釣魚以竊取 Office 365 憑證。" },
            { fake: "faacebook.com", real: "facebook.com", type: "新增 'a'", context: "釣魚和廣告重新導向；常見於社群媒體目標。" },
            { fake: "yuube.com", real: "youtube.com", type: "省略 't'", context: "重新導向至惡意軟體或偽造的擴充功能（據報活躍至 2025 年）。" },
            { fake: "jacqumus.com", real: "jacquemus.com", type: "省略 'e'", context: "2020 年針對時尚品牌使用者的惡意軟體分發。" },
            { fake: "onedrivesync.com", real: "onedrive.com", type: "新增單字 ('sync')", context: "組合搶注變體；託管惡意遠端工具 (2024)。" }
        ];

        const TOTAL_QUESTIONS = 10; 
        
        let quizPool = [];
        let score = 0;
        let questionIndex = 0;
        let currentQuestion = null;
        let currentOptions = []; 

        const gameScreen = document.getElementById('gameScreen');
        const finalScreen = document.getElementById('finalScreen');
        const btn1 = document.getElementById('btn1');
        const btn2 = document.getElementById('btn2');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const qCountDisplay = document.getElementById('qCountDisplay');
        const progressBar = document.getElementById('progressBar');
        const resultArea = document.getElementById('resultArea');
        const resultHeader = document.getElementById('resultHeader');
        const realDomainDisplay = document.getElementById('realDomainDisplay');
        const spoofTypeDisplay = document.getElementById('spoofTypeDisplay');
        const contextDisplay = document.getElementById('contextDisplay');
        const nextBtn = document.getElementById('nextBtn');
        const finalScoreDisplay = document.getElementById('finalScoreDisplay');
        const finalMessage = document.getElementById('finalMessage');
        const summaryList = document.getElementById('summaryList');

        function initGame() {
            let deepCopy = JSON.parse(JSON.stringify(rawData));
            let shuffled = deepCopy.sort(() => 0.5 - Math.random());
            quizPool = shuffled.slice(0, TOTAL_QUESTIONS);
            score = 0;
            questionIndex = 0;
            gameScreen.style.display = 'block';
            finalScreen.style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            if (questionIndex >= quizPool.length) {
                endGame();
                return;
            }

            resultArea.style.display = 'none';
            btn1.disabled = false;
            btn2.disabled = false;
            btn1.className = 'domain-btn';
            btn2.className = 'domain-btn';

            qCountDisplay.textContent = `問題：${questionIndex + 1} / ${TOTAL_QUESTIONS}`;
            const progressPercent = ((questionIndex) / TOTAL_QUESTIONS) * 100;
            progressBar.style.width = `${progressPercent}%`;
            scoreDisplay.textContent = `分數：${score}`;

            currentQuestion = quizPool[questionIndex];
            const opt1 = { text: currentQuestion.fake, isFake: true };
            const opt2 = { text: currentQuestion.real, isFake: false };

            if (Math.random() > 0.5) {
                currentOptions = [opt1, opt2];
            } else {
                currentOptions = [opt2, opt1];
            }

            btn1.textContent = currentOptions[0].text;
            btn2.textContent = currentOptions[1].text;
        }

        function handleChoice(btnIndex) {
            const choice = currentOptions[btnIndex];
            const isCorrect = choice.isFake;

            currentQuestion.userWasCorrect = isCorrect;

            btn1.disabled = true;
            btn2.disabled = true;

            if (isCorrect) score++;

            if (currentOptions[0].isFake) {
                btn1.classList.add('result-correct'); 
                btn2.classList.add('result-wrong');   
            } else {
                btn1.classList.add('result-wrong');
                btn2.classList.add('result-correct');
            }

            scoreDisplay.textContent = `分數：${score}`;
            showResult(isCorrect, choice.text);
        }

        function showResult(isCorrect, selectedDomain) {
            resultArea.style.display = 'block';

            if (isCorrect) {
                resultHeader.className = 'info-header header-correct';
                resultHeader.textContent = `✅ 正確！ ${selectedDomain} 是假網域。`;
            } else {
                resultHeader.className = 'info-header header-wrong';
                resultHeader.textContent = `❌ 錯誤！您點擊了合法的網域。`;
            }

            realDomainDisplay.textContent = currentQuestion.real;
            spoofTypeDisplay.textContent = currentQuestion.type;
            contextDisplay.textContent = currentQuestion.context;

            if (questionIndex === quizPool.length - 1) {
                nextBtn.textContent = "查看最終摘要 🏁";
            } else {
                nextBtn.textContent = "下一題 ➡️";
            }
        }

        function nextQuestion() {
            questionIndex++;
            loadQuestion();
        }

        function endGame() {
            gameScreen.style.display = 'none';
            finalScreen.style.display = 'block';

            const percentage = Math.round((score / TOTAL_QUESTIONS) * 100);
            finalScoreDisplay.textContent = `${percentage}%`;
            finalMessage.textContent = `您正確識別了 ${TOTAL_QUESTIONS} 個釣魚網域中的 ${score} 個。`;

            summaryList.innerHTML = "";

            quizPool.forEach(item => {
                const card = document.createElement('div');
                const isWin = item.userWasCorrect;
                
                card.className = isWin ? "summary-card summary-win" : "summary-card summary-loss";
                
                const statusTag = isWin 
                    ? `<span class="tag-correct">正確</span>` 
                    : `<span class="tag-wrong">錯過</span>`;

                card.innerHTML = `
                    <div class="summary-head">
                        <span class="summary-fake-url">${item.fake}</span>
                        ${statusTag}
                    </div>
                    <div class="summary-details">
                        <strong>類型：</strong> ${item.type}<br>
                        <strong>情報：</strong> ${item.context}
                    </div>
                `;
                summaryList.appendChild(card);
            });
        }
        
        initGame();
    </script>
</body>
</html>
