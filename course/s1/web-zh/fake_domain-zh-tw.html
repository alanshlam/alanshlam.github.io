<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>釣魚網域獵人 v2.3</title>
    <style>
        :root {
            --primary: #4f46e5; --primary-light: #eef2ff; --success: #16a34a;
            --danger: #dc2626; --bg: #f3f4f6; --card-bg: #ffffff;
            --text: #1f2937; --info: #0ea5e9;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background-color: var(--bg); color: var(--text); display: flex; flex-direction: column;
            align-items: center; min-height: 100vh; margin: 0; padding: 20px;
        }
        .container { max-width: 800px; width: 100%; background: var(--card-bg); border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); padding: 2rem; text-align: center; }
        h1 { margin-bottom: 0.5rem; color: var(--primary); }
        .subtitle { color: #6b7280; margin-bottom: 2rem; }
        .progress-container { width: 100%; background-color: #e5e7eb; border-radius: 999px; height: 8px; margin-bottom: 20px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--primary); width: 0%; transition: width 0.3s ease; }
        .stats { display: flex; justify-content: space-between; background: #f9fafb; padding: 10px 20px; border-radius: 8px; margin-bottom: 2rem; font-weight: 600; border: 1px solid #e5e7eb; }
        .question-area { margin-bottom: 2rem; }
        .instruction { font-size: 1.2rem; margin-bottom: 1.5rem; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        button.domain-btn {
            background: white; border: 2px solid #e5e7eb; padding: 1.5rem; border-radius: 8px;
            font-size: 1.1rem; cursor: pointer; transition: all 0.2s; font-family: 'Courier New', Courier, monospace; 
            word-break: break-all; color: #374151; font-weight: 600;
        }
        button.domain-btn:hover:not(:disabled) { border-color: var(--primary); background: #eef2ff; transform: translateY(-2px); }
        button.domain-btn:disabled { cursor: not-allowed; opacity: 0.7; }
        .result-correct { border-color: var(--success) !important; background-color: #dcfce7 !important; color: var(--success) !important; }
        .result-wrong { border-color: var(--danger) !important; background-color: #fee2e2 !important; color: var(--danger) !important; }
        .info-box { display: none; text-align: left; margin-top: 2rem; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; animation: fadeIn 0.5s; background: #f9fafb; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .info-header { padding: 1rem; color: white; font-weight: bold; text-align: center; }
        .header-correct { background-color: var(--success); }
        .header-wrong { background-color: var(--danger); }
        .info-content { padding: 1.5rem; }
        .info-label { font-weight: bold; color: #6b7280; font-size: 0.85rem; text-transform: uppercase; margin-top: 12px; display: block;}
        .info-text { margin: 4px 0 0 0; color: #1f2937; }
        .action-btn { background-color: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 1rem; margin-top: 1.5rem; cursor: pointer; transition: background 0.2s; }
        .action-btn:hover { background-color: #4338ca; }
        #finalScreen { display: none; }
        .score-circle { width: 140px; height: 140px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; margin: 0 auto 2rem auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .section-title { color: #1f2937; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-top: 30px; margin-bottom: 20px; text-align: left; }
        .summary-container { text-align: left; margin-top: 2rem; }
        .summary-card { background: #f9fafb; border: 1px solid #e5e7eb; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; border-left: 6px solid #ccc; font-size: 0.95rem; }
        .summary-win { border-left-color: var(--success); background-color: #f0fdf4; }
        .summary-loss { border-left-color: var(--danger); background-color: #fef2f2; }
        .summary-reference { border-left-color: var(--info); background-color: #f0f9ff; }
        .summary-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .summary-fake-url { font-family: 'Courier New', monospace; font-weight: bold; font-size: 1.1rem; color: #dc2626; }
        .summary-real-url { font-family: 'Courier New', monospace; font-size: 0.9rem; color: #16a34a; }
        .tag-correct { color: var(--success); font-weight: bold; font-size: 0.8rem; text-transform: uppercase; background: #dcfce7; padding: 2px 8px; border-radius: 4px; }
        .tag-wrong { color: var(--danger); font-weight: bold; font-size: 0.8rem; text-transform: uppercase; background: #fee2e2; padding: 2px 8px; border-radius: 4px; }
        .tag-info { color: var(--info); font-weight: bold; font-size: 0.8rem; text-transform: uppercase; background: #e0f2fe; padding: 2px 8px; border-radius: 4px; }
        .summary-details { color: #4b5563; font-size: 0.9rem; line-height: 1.4; margin-top: 8px;}
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } .container { padding: 1rem; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎣 釣魚網域獵人</h1>
        <div id="gameScreen">
            <p class="subtitle">從更新的資料集中識別假網域</p>
            <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
            <div class="stats">
                <span id="scoreDisplay">分數：0</span>
                <span id="qCountDisplay">問題：1 / 10</span>
            </div>
            <div class="question-area">
                <p class="instruction">選擇<strong>假的</strong>網域：</p>
                <div class="options-grid" id="optionsContainer">
                    <button class="domain-btn" id="btn1" onclick="handleChoice(0)"></button>
                    <button class="domain-btn" id="btn2" onclick="handleChoice(1)"></button>
                </div>
            </div>
            <div id="resultArea" class="info-box">
                <div id="resultHeader" class="info-header"></div>
                <div class="info-content">
                    <span class="info-label">合法網域</span><p class="info-text" id="realDomainDisplay"></p>
                    <span class="info-label">變異類型</span><p class="info-text" id="spoofTypeDisplay"></p>
                    <span class="info-label">情境 / 攻擊細節</span><p class="info-text" id="contextDisplay"></p>
                    <div style="text-align: center;"><button class="action-btn" id="nextBtn" onclick="nextQuestion()">下一題 ➡️</button></div>
                </div>
            </div>
        </div>
        <div id="finalScreen">
            <div class="score-circle" id="finalScoreDisplay">0%</div>
            <h2>訓練完成！</h2>
            <p id="finalMessage">您正確識別了 Y 個釣魚網域中的 X 個。</p>
            <button class="action-btn" onclick="initGame()">重新訓練 🔄</button>
            <div class="summary-container">
                <h3 class="section-title">📊 您的本次結果</h3>
                <div id="summaryList"></div>
                <h3 class="section-title">📚 完整威脅資料庫（學員參考）</h3>
                <p style="font-size: 0.9rem; color: #666; margin-bottom: 1rem;">請檢閱以下系統中所有潛在的釣魚變異：</p>
                <div id="fullDbContainer"></div>
            </div>
        </div>
    </div>
    <script>
        const rawData = [
            { fake: "goggle.com", real: "google.com", type: "新增 'g'", context: "2006年著名的釣魚網站，會下載惡意軟體；最早期的知名案例之一。" },
            { fake: "gooogle.com", real: "google.com", type: "新增 'o'", context: "常用於釣魚和廣告獲利的變體；在多個活動中成為目標。" },
            { fake: "gogle.com", real: "google.com", type: "省略 'o'", context: "字元省略；重新導向至惡意網站或廣告。" },
            { fake: "paypa1.com", real: "paypal.com", type: "'1' 取代 'l'", context: "憑證竊取釣魚；典型的替換攻擊。" },
            { fake: "amazan.com", real: "amazon.com", type: "省略 'o'", context: "重新導向至充滿廣告的頁面並安裝可能不需要的程式 (PUP)。" },
            { fake: "offlice365.com", real: "office365.com", type: "新增 'f'", context: "託管偽造的 Microsoft 登入頁面以進行憑證收集 (2024–2025)。" },
            { fake: "micrsoft.com", real: "microsoft.com", type: "調換 'o' 和 's'", context: "用於企業釣魚以竊取 Office 365 憑證。" },
            { fake: "faacebook.com", real: "facebook.com", type: "新增 'a'", context: "釣魚和廣告重新導向；常見於社群媒體目標。" },
            { fake: "yuube.com", real: "youtube.com", type: "省略 't'", context: "重新導向至惡意軟體或偽造的擴充功能（據報活躍至 2025 年）。" },
            { fake: "jacqumus.com", real: "jacquemus.com", type: "省略 'e'", context: "2020 年針對時尚品牌使用者的惡意軟體分發。" },
            { fake: "onedrivesync.com", real: "onedrive.com", type: "新增單字 ('sync')", context: "組合搶注變體；託管惡意遠端工具 (2024)。" },
            { fake: "rnicrosoft.com", real: "microsoft.com", type: "字元替換 (r+n 取代 m)", context: "用於 Microsoft 冒充釣魚郵件以竊取 Office 365 憑證；自 2020 年起常見於 BEC 攻擊。" },
            { fake: "micros0ft.com", real: "microsoft.com", type: "零取代 'o'", context: "廣泛 Office 365 登入詐騙中的打字錯誤搶注變體；在 2023-2024 年的活動中針對企業進行憑證竊取。" },
            { fake: "g00gle.com", real: "google.com", type: "零取代 'o'", context: "Gmail 釣魚中的典型打字錯誤搶注；重新導向至偽造登入頁面，自 2015 年以來在攻擊中出現。" },
            { fake: "goigle.com", real: "google.com", type: "缺少 'o'", context: "利用搜尋相關釣魚中的打字錯誤；用於廣告詐欺和惡意軟體分發，直至 2024 年。" },
            { fake: "cl0udflare.com", real: "cloudflare.com", type: "零取代 'o'", context: "在「Oktapus」釣魚浪潮（2022-2023）中冒充 Cloudflare，針對企業存取的 MFA 重設。" },
            { fake: "cloudflare-okta.com", real: "cloudflare.com / okta.com", type: "品牌串聯", context: "在 Oktapus 攻擊前幾分鐘註冊；誘騙使用者進入混合登入頁面以收集憑證。" },
            { fake: "gacebook.com", real: "facebook.com", type: "缺少 'f'", context: "早期的 Facebook 登入釣魚（2020 年前）；後來 Facebook 實施自動重新導向以對抗。" },
            { fake: "wlklpedia.org", real: "wikipedia.org", type: "'k' 取代 'i'", context: "維基百科捐款詐騙；自 2018 年以來用於模仿慈善活動的電子郵件活動。" },
            { fake: "rnicrosoft-security.com", real: "microsoft.com", type: "字元替換 + 字首", context: "BEC 變體，附加 'security' 以製造緊迫感；在 2024 年的事件中竊取高階主管憑證。" },
            { fake: "secure-google-login.com", real: "google.com", type: "新增字首", context: "Google Workspace 釣魚；在 2023-2025 年的浪潮中託管偽造的 2FA 提示。" },
            { fake: "insurrance.com", real: "insurance.com", type: "多一個 'r'", context: "用於保險理賠詐騙的打字錯誤搶注；透過帶有惡意軟體的電子郵件附件進行攻擊。" },
            { fake: "travelcity.com", real: "travelocity.com", type: "缺少 'o'", context: "旅遊預訂詐欺；在 2022 年假日活動中重新導向至偽造的預訂網站。" },
            { fake: "awsdns-061.org", real: "awsdns-61.org", type: "移除連字號", context: "在 2018 年 Coincheck 加密貨幣駭客事件中被劫持；用於在漏洞後聯繫受害者進行進一步釣魚。" },
            { fake: "findfotos.com", real: "findphotos.com", type: "替代拼寫", context: "冒充相片分享服務；用於 2019 年左右的資料竊取活動。" }
        ];

        const TOTAL_QUESTIONS = 10;
        let quizPool = [], score = 0, questionIndex = 0, currentQuestion = null, currentOptions = [];

        const gameScreen = document.getElementById('gameScreen'), finalScreen = document.getElementById('finalScreen'),
            btn1 = document.getElementById('btn1'), btn2 = document.getElementById('btn2'),
            scoreDisplay = document.getElementById('scoreDisplay'), qCountDisplay = document.getElementById('qCountDisplay'),
            progressBar = document.getElementById('progressBar'), resultArea = document.getElementById('resultArea'),
            resultHeader = document.getElementById('resultHeader'), realDomainDisplay = document.getElementById('realDomainDisplay'),
            spoofTypeDisplay = document.getElementById('spoofTypeDisplay'), contextDisplay = document.getElementById('contextDisplay'),
            nextBtn = document.getElementById('nextBtn'), finalScoreDisplay = document.getElementById('finalScoreDisplay'),
            finalMessage = document.getElementById('finalMessage'), summaryList = document.getElementById('summaryList'),
            fullDbContainer = document.getElementById('fullDbContainer');

        function initGame() {
            let deepCopy = JSON.parse(JSON.stringify(rawData));
            quizPool = deepCopy.sort(() => 0.5 - Math.random()).slice(0, TOTAL_QUESTIONS);
            score = 0; questionIndex = 0;
            gameScreen.style.display = 'block'; finalScreen.style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            if (questionIndex >= quizPool.length) { endGame(); return; }
            resultArea.style.display = 'none';
            btn1.disabled = false; btn2.disabled = false;
            btn1.className = 'domain-btn'; btn2.className = 'domain-btn';
            qCountDisplay.textContent = `問題：${questionIndex + 1} / ${TOTAL_QUESTIONS}`;
            progressBar.style.width = `${((questionIndex) / TOTAL_QUESTIONS) * 100}%`;
            scoreDisplay.textContent = `分數：${score}`;
            currentQuestion = quizPool[questionIndex];
            const opt1 = { text: currentQuestion.fake, isFake: true }, opt2 = { text: currentQuestion.real, isFake: false };
            currentOptions = Math.random() > 0.5 ? [opt1, opt2] : [opt2, opt1];
            btn1.textContent = currentOptions[0].text; btn2.textContent = currentOptions[1].text;
        }

        function handleChoice(btnIndex) {
            const choice = currentOptions[btnIndex];
            const isCorrect = choice.isFake;
            currentQuestion.userWasCorrect = isCorrect;
            btn1.disabled = true; btn2.disabled = true;
            if (isCorrect) score++;
            if (currentOptions[0].isFake) { btn1.classList.add('result-correct'); btn2.classList.add('result-wrong'); } 
            else { btn1.classList.add('result-wrong'); btn2.classList.add('result-correct'); }
            scoreDisplay.textContent = `分數：${score}`;
            showResult(isCorrect, choice.text);
        }

        function showResult(isCorrect, selectedDomain) {
            resultArea.style.display = 'block';
            resultHeader.className = isCorrect ? 'info-header header-correct' : 'info-header header-wrong';
            resultHeader.textContent = isCorrect ? `✅ 正確！ ${selectedDomain} 是假網域。` : `❌ 錯誤！您點擊了合法的網域。`;
            realDomainDisplay.textContent = currentQuestion.real;
            spoofTypeDisplay.textContent = currentQuestion.type;
            contextDisplay.textContent = currentQuestion.context;
            nextBtn.textContent = questionIndex === quizPool.length - 1 ? "查看最終摘要 🏁" : "下一題 ➡️";
        }

        function nextQuestion() {
            questionIndex++;
            loadQuestion();
        }

        function endGame() {
            gameScreen.style.display = 'none'; finalScreen.style.display = 'block';
            const percentage = Math.round((score / TOTAL_QUESTIONS) * 100);
            finalScoreDisplay.textContent = `${percentage}%`;
            finalMessage.textContent = `您正確識別了 ${TOTAL_QUESTIONS} 個釣魚網域中的 ${score} 個。`;
            summaryList.innerHTML = "";
            quizPool.forEach(item => {
                const card = document.createElement('div');
                card.className = item.userWasCorrect ? "summary-card summary-win" : "summary-card summary-loss";
                const statusTag = item.userWasCorrect ? `<span class="tag-correct">正確</span>` : `<span class="tag-wrong">錯過</span>`;
                card.innerHTML = `<div class="summary-head"><div><span class="summary-fake-url">${item.fake}</span><br><span class="summary-real-url">真實網域：${item.real}</span></div>${statusTag}</div><div class="summary-details"><strong>類型：</strong> ${item.type}<br><strong>情報：</strong> ${item.context}</div>`;
                summaryList.appendChild(card);
            });

            fullDbContainer.innerHTML = "";
            const sortedData = [...rawData].sort((a, b) => a.fake.localeCompare(b.fake));
            sortedData.forEach(item => {
                const card = document.createElement('div');
                card.className = "summary-card summary-reference";
                card.innerHTML = `<div class="summary-head"><div><span class="summary-fake-url" style="color:#1f2937;">${item.fake}</span><br><span class="summary-real-url">真實網域：${item.real}</span></div><span class="tag-info">資料庫條目</span></div><div class="summary-details"><strong>類型：</strong> ${item.type}<br><strong>情報：</strong> ${item.context}</div>`;
                fullDbContainer.appendChild(card);
            });
        }
        initGame();
    </script>
</body>
</html>
