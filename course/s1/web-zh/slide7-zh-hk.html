<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網絡安全 - 第七課</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
            --danger-color: #e74c3c;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.9em;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <div class="visual-container">
            <img id="slide-img" src="" alt="簡報視覺圖示">
        </div>
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
            </div>
            <div class="slide-footer">
                第七課：日常網絡安全要點與應急響應
            </div>
        </div>
    </div>
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; 上一頁</button>
        <span class="progress" id="slide-counter">1 / 11</span>
        <button id="nextBtn" onclick="changeSlide(1)">下一頁 &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; 全螢幕</button>
    </div>
</div>

<script>
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p7-";
    
    const slides = [
        {
            id: 1,
            html: `
                <h1>常見網絡安全事件</h1>
                <hr>
                <h3>威脅簡報</h3>
                <p><strong>第七課</strong></p>
            `
        },
        {
            id: 2,
            html: `
                <h3>咩係安全事件？</h3>
                <p>一個你資訊安全受到威脅嘅事件。</p>
                <ol>
                    <li><strong>釣魚攻擊</strong> (欺騙)</li>
                    <li><strong>勒索軟件攻擊</strong> (干擾)</li>
                    <li><strong>資料洩漏 / 數據外洩</strong> (盜竊)</li>
                </ol>
            `
        },
        {
            id: 3,
            html: `
                <h3>事件 #1：釣魚攻擊</h3>
                <p><strong>目標：</strong>偷你嘅登入憑證。</p>
                <p><strong>點樣運作：</strong></p>
                <ol>
                    <li><strong>誘餌：</strong>傳送一封帶有假登入連結嘅欺騙性電郵。</li>
                    <li><strong>錯誤：</strong>你點擊連結，然後輸入你嘅用戶名同密碼。</li>
                    <li><strong>事件：</strong>攻擊者獲取你嘅憑證，然後騎劫你嘅真實帳戶。</li>
                </ol>
            `
        },
        {
            id: 4,
            html: `
                <h3>事件 #2：勒索軟件攻擊</h3>
                <p><strong>目標：</strong>將你啲檔案當人質嚟勒索金錢。</p>
                <p><strong>點樣運作：</strong></p>
                <ol>
                    <li><strong>入口：</strong>你打開一個惡意嘅電郵附件。</li>
                    <li><strong>感染：</strong>勒索軟件靜靜雞安裝，然後開始加密你啲檔案。</li>
                    <li><strong>危機：</strong>出現一張勒索字條。你所有嘅資料都被鎖住。</li>
                </ol>
            `
        },
        {
            id: 5,
            html: `
                <h3>勒索軟件嘅影響</h3>
                <table style="text-align:center;">
                    <tr>
                        <th style="text-align:center; padding:20px;">&#127981;<br>運作停頓</th>
                        <th style="text-align:center; padding:20px;">&#128274;<br>資料無法存取</th>
                        <th style="text-align:center; padding:20px;">&#128184;<br>重大財務損失</th>
                    </tr>
                </table>
                <h2 style="margin-top:20px;"><strong>備份係你第一道防線。</strong></h2>
            `
        },
        {
            id: 6,
            html: `
                <h3>事件 #3：資料洩漏 / 數據外洩</h3>
                <p><strong>目標：</strong>大量盜竊敏感資訊。</p>
                <p><strong>係咩嚟：</strong>你嘅個人資料（電郵、密碼、信用卡資料）由一間公司嘅數據庫被偷走。</p>
                <p><strong>點樣發生：</strong>黑客攻擊、密碼被盜，甚至只係意外。</p>
            `
        },
        {
            id: 7,
            html: `
                <h3>點解你要關心數據外洩？</h3>
                <p>你洩漏出去嘅密碼會被罪犯用嚟嘗試登入你<strong>其他</strong>嘅帳戶。</p>
                <div style="background:#e8f4fc; padding:15px; border-radius:5px; margin:15px 0;">
                    <strong>呢個叫做「憑證填充攻擊」。</strong>
                </div>
                <p>佢哋就係靠住啲人會<strong>重複使用密碼</strong>呢個習慣。</p>
            `
        },
        {
            id: 8,
            html: `
                <h3>你有冇喺數據外洩中受影響？</h3>
                <p>你可以檢查你嘅電郵地址有冇喺已知嘅數據外洩事件中曝光。</p>
                <p>請瀏覽呢個免費、安全又信譽良好嘅網站：</p>
                <h2><a href="https://haveibeenpwned.com" target="_blank">haveibeenpwned.com</a></h2>
            `
        },
        {
            id: 9,
            html: `
                <h3>事件總結</h3>
                <table>
                    <tr>
                        <th>事件</th>
                        <th>攻擊對象...</th>
                    </tr>
                    <tr>
                        <td><strong>釣魚</strong></td>
                        <td>你嘅信任 (欺騙)</td>
                    </tr>
                    <tr>
                        <td><strong>勒索軟件</strong></td>
                        <td>你嘅存取權 (干擾)</td>
                    </tr>
                    <tr>
                        <td><strong>資料洩漏</strong></td>
                        <td>你嘅資訊 (盜竊)</td>
                    </tr>
                </table>
            `
        },
        {
            id: 10,
            html: `
                <h3>下次...</h3>
                <h1><strong>當安全事件發生時，應該點做。</strong></h1>
            `
        },
        {
            id: 11,
            html: `
                <div class="question-slide">
                    <h1>有問題嗎？</h1>
                    <hr>
                    <p>多謝收聽！</p>
                    <p>大家可以就今日嘅主題隨便發問。</p>
                </div>
            `
        }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;
        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; 離開全螢幕";
        } else {
            fsBtn.innerHTML = "&#9974; 全螢幕";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
