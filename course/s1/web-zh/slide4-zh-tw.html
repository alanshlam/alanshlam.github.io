<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網路安全 - 第四單元</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
            --danger-color: #e74c3c;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        code {
            background: #eee;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 1.1em;
        }

        .url-box {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 5px solid;
        }
        .url-good {
            background-color: #e8f8f5;
            border-color: var(--success-color);
        }
        .url-bad {
            background-color: #fdedec;
            border-color: var(--danger-color);
        }

        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {

        /* --- Mobile Scrolling & Layout Fix --- */
        body {
            display: block; /* Allow natural page scrolling instead of flex centering */
            padding: 15px 0;
            align-items: normal; /* Override centering */
            justify-content: normal;
        }
        .container {
            width: 100%;
            max-height: none; /* Remove fixed height that prevents scrolling */
            height: auto;
            overflow: visible; /* Show all content */
            margin: 0;
            border-radius: 0;
            box-shadow: none;
        }
        .slide-content {
            min-height: unset; /* Let content determine its own height */
            overflow: visible;
        }
        .dynamic-content {
            overflow-y: visible; /* Disable the internal scroll area to let the page scroll */
        }
        h1 { font-size: 1.8em; }
        .controls {
            position: sticky;
            bottom: 0;
            border-top: 1px solid #ccc;
        }
        .controls button {
            padding: 12px 14px;
            min-height: 44px;
        }
        /* --- End Mobile Fix --- */
    
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <div class="visual-container">
            <img id="slide-img" src="" alt="簡報視覺圖示">
        </div>
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
            </div>
            <div class="slide-footer">
                第四單元：日常網路安全要點與應急響應
            </div>
        </div>
    </div>
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; 上一頁</button>
        <span class="progress" id="slide-counter">1 / 9</span>
        <button id="nextBtn" onclick="changeSlide(1)">下一頁 &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; 全螢幕</button>
    </div>
</div>

<script>
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p4-";
    
    const slides = [
        {
            id: 1,
            html: `
                <h1>安全瀏覽習慣</h1>
                <hr>
                <h3>您的網際網路道路規則</h3>
                <p><strong>第四單元</strong></p>
            `
        },
        {
            id: 2,
            html: `
                <h3>最重要的信號：鎖頭</h3>
                <h2><strong>HTTPS = 安全連線</strong></h2>
                <p>這表示您與網站之間的對話是私密的。</p>
                <div style="background:#e8f4fc; padding:15px; border-radius:5px; margin-top:20px;">
                    <strong>規則一：沒有鎖頭？就沒有私人資訊。</strong>
                    <br>(絕不在沒有鎖頭的網站上輸入密碼或信用卡！)
                </div>
            `
        },
        {
            id: 3,
            html: `
                <h3>您能分辨出哪個是假的嗎？</h3>
                
                <div class="url-box url-good">
                    <strong>合法的：</strong><br>
                    <code>https://www.<strong>myrealbank.com</strong>/login</code><br>
                    <em>(網域：myrealbank.com)</em>
                </div>

                <div class="url-box url-bad">
                    <strong>假的：</strong><br>
                    <code>https://www.myrealbank.com.<strong>security-update.net</strong>/login</code><br>
                    <em>(網域：security-update.net)</em>
                </div>

                <p><strong>永遠檢查第一個 <code>/</code> 之前的核心網域名稱。</strong></p>
            `
        },
        {
            id: 4,
            html: `
                <h3>點擊前請三思</h3>
                <p>連結可能會說謊！一個顯示為 <code>mybank.com</code> 的連結，可能暗中指向別處。</p>
                <ul>
                    <li><strong>在電腦上：</strong>將滑鼠<strong>懸停</strong>在連結上，查看其真實目的地。</li>
                    <li><strong>在手機上：長按</strong>連結，查看真實的網址。</li>
                </ul>
                <p><strong>黃金法則：如有疑問，請親自輸入網址。</strong></p>
            `
        },
        {
            id: 5,
            html: `
                <h3>小心：假的警告和彈出視窗！</h3>
                <h2 style="color:var(--danger-color);"><strong>這些永遠是騙局。</strong></h2>
                <p>您的瀏覽器和作業系統<strong>絕不會</strong>在網站上使用彈出廣告來警告您有病毒。</p>
                <p>它們的設計目的就是為了嚇唬您。直接關閉頁面即可。</p>
            `
        },
        {
            id: 6,
            html: `
                <h3>公共 Wi-Fi 就像明信片</h3>
                <p>在不安全的網路（咖啡店、機場）上，您的活動可能會被同一個網路上的其他人看到。</p>
                <hr>
                <p><strong>解決方案是什麼？</strong></p>
            `
        },
        {
            id: 7,
            html: `
                <h3>VPN：您的私人隧道</h3>
                <p><strong>VPN (虛擬私人網路)</strong> 會建立一個安全、加密的連線。</p>
                <ul>
                    <li>它會打亂您的資料，讓任何試圖在公共網路上窺探的人都無法讀取。</li>
                </ul>
                <p style="background:#e8f4fc; padding:15px; border-radius:5px;"><strong>當您在使用無法控制的 Wi-Fi 時，請使用 VPN。</strong></p>
            `
        },
        {
            id: 8,
            html: `
                <h3>您的行動計畫</h3>
                <ol>
                    <li>在輸入敏感資料前，<strong>先尋找鎖頭</strong> (https)。</li>
                    <li><strong>點擊前先懸停</strong>，以驗證連結。</li>
                    <li>對所有緊急的彈出視窗和警告<strong>保持懷疑</strong>。</li>
                    <li>在公共 Wi-Fi 上<strong>使用 VPN</strong>。</li>
                </ol>
            `
        },
        {
            id: 9,
            html: `
                <div class="question-slide">
                    <h1>有任何問題嗎？</h1>
                    <hr>
                    <p>感謝您的聆聽！</p>
                    <p>現在開放問答時間，歡迎針對今天的議題提問。</p>
                </div>
            `
        }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;

        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; 離開全螢幕";
        } else {
            fsBtn.innerHTML = "&#9974; 全螢幕";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
