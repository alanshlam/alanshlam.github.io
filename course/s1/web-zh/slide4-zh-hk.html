<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網絡安全 - 第四課</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --footer-color: #95a5a6;
            --danger-color: #e74c3c;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s; 
        }

        body:fullscreen {
            background-color: #000;
        }
        
        body:-webkit-full-screen {
            background-color: #000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh; 
        }

        .slide-content {
            display: flex;
            flex-direction: row;
            min-height: 500px;
            overflow: hidden; 
        }

        .visual-container {
            flex: 1;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .visual-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        .text-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: white;
        }

        .dynamic-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--footer-color);
            text-align: right;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        ul, ol {
            line-height: 1.6;
        }

        li {
            margin-bottom: 10px;
        }

        code {
            background: #eee;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 1.1em;
        }

        .url-box {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 5px solid;
        }
        .url-good {
            background-color: #e8f8f5;
            border-color: var(--success-color);
        }
        .url-bad {
            background-color: #fdedec;
            border-color: var(--danger-color);
        }

        .question-slide {
            text-align: center;
        }
        .question-slide h1 {
            font-size: 3em;
            color: var(--accent-color);
        }

        .controls {
            background-color: #fff;
            border-top: 1px solid #eee;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px; 
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #fullscreenBtn {
            background-color: #2c3e50; 
        }
        #fullscreenBtn:hover {
            background-color: #1a252f;
        }

        .progress {
            font-weight: bold;
            color: #7f8c8d;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .slide-content {
                flex-direction: column;
            }
            .visual-container {
                border-right: none;
                border-bottom: 1px solid #ddd;
                min-height: 250px;
            }
            .text-container {
                padding: 20px;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="slide-content">
        <div class="visual-container">
            <img id="slide-img" src="" alt="簡報視覺圖示">
        </div>
        <div class="text-container">
            <div id="slide-text-content" class="dynamic-content">
            </div>
            <div class="slide-footer">
                日常網絡安全要點與應急響應
            </div>
        </div>
    </div>
    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&#8592; 上一頁</button>
        <span class="progress" id="slide-counter">1 / 9</span>
        <button id="nextBtn" onclick="changeSlide(1)">下一頁 &#8594;</button>
        <div style="flex-grow:1"></div>
        <button id="fullscreenBtn" onclick="toggleFullScreen()">&#9974; 全螢幕</button>
    </div>
</div>

<script>
    const imageBaseUrl = "https://alanshlam.github.io/course/s1/img/p4-";
    
    const slides = [
        {
            id: 1,
            html: `
                <h1>安全瀏覽習慣</h1>
                <hr>
                <h3>你嘅互聯網道路規則</h3>
                <p><strong>第四課</strong></p>
            `
        },
        {
            id: 2,
            html: `
                <h3>最重要嘅信號：鎖頭</h3>
                <h2><strong>HTTPS = 安全連線</strong></h2>
                <p>呢個意思係你同網站之間嘅對話係私密嘅。</p>
                <div style="background:#e8f4fc; padding:15px; border-radius:5px; margin-top:20px;">
                    <strong>規則一：冇鎖頭？冇私人資料。</strong>
                    <br>(絕對唔好喺冇鎖頭嘅網站輸入密碼或信用卡資料！)
                </div>
            `
        },
        {
            id: 3,
            html: `
                <h3>你分唔分得出邊個係假？</h3>
                
                <div class="url-box url-good">
                    <strong>真嘅：</strong><br>
                    <code>https://www.<strong>myrealbank.com</strong>/login</code><br>
                    <em>(域名：myrealbank.com)</em>
                </div>

                <div class="url-box url-bad">
                    <strong>假嘅：</strong><br>
                    <code>https://www.myrealbank.com.<strong>security-update.net</strong>/login</code><br>
                    <em>(域名：security-update.net)</em>
                </div>

                <p><strong>喺第一個 <code>/</code> 前面，一定要檢查核心域名。</strong></p>
            `
        },
        {
            id: 4,
            html: `
                <h3>點擊前諗一諗</h3>
                <p>連結會呃人！一個寫住 <code>mybank.com</code> 嘅連結可以暗中指去第二度。</p>
                <ul>
                    <li><strong>喺電腦上：</strong>將滑鼠<strong>懸停</strong>喺連結上面，睇下佢真正嘅目的地。</li>
                    <li><strong>喺手機上：長按</strong>個連結，睇下真正嘅網址。</li>
                </ul>
                <p><strong>黃金法則：如有懷疑，自己手動輸入網址。</strong></p>
            `
        },
        {
            id: 5,
            html: `
                <h3>小心：假嘅警告同彈出視窗！</h3>
                <h2 style="color:var(--danger-color);"><strong>呢啲永遠都係呃人嘅。</strong></h2>
                <p>你嘅瀏覽器同操作系統<strong>絕對唔會</strong>用網站上嘅彈出廣告嚟警告你有病毒。</p>
                <p>佢哋設計出嚟就係為咗嚇你。即刻閂咗個頁面就得。</p>
            `
        },
        {
            id: 6,
            html: `
                <h3>公共 Wi-Fi 好似明信片</h3>
                <p>喺一個唔安全嘅網絡（例如咖啡店、機場），你嘅活動可能會俾同一個網絡上嘅其他人睇到。</p>
                <hr>
                <p><strong>解決方法係咩？</strong></p>
            `
        },
        {
            id: 7,
            html: `
                <h3>VPN：你嘅私人隧道</h3>
                <p><strong>VPN (虛擬私人網絡)</strong> 會創建一個安全、加密嘅連線。</p>
                <ul>
                    <li>佢會將你嘅數據打亂，令到喺公共網絡上想偷窺嘅人睇唔明。</li>
                </ul>
                <p style="background:#e8f4fc; padding:15px; border-radius:5px;"><strong>喺你唔能夠控制嘅 Wi-Fi 上，就要用 VPN。</strong></p>
            `
        },
        {
            id: 8,
            html: `
                <h3>你嘅行動計劃</h3>
                <ol>
                    <li>輸入敏感資料前，<strong>先睇下有冇鎖頭</strong> (https)。</li>
                    <li><strong>點擊前先懸停</strong>，核實連結。</li>
                    <li>對所有緊急嘅彈出視窗同警告<strong>保持懷疑</strong>。</li>
                    <li>喺公共 Wi-Fi 上<strong>使用 VPN</strong>。</li>
                </ol>
            `
        },
        {
            id: 9,
            html: `
                <div class="question-slide">
                    <h1>有問題嗎？</h1>
                    <hr>
                    <p>多謝收聽！</p>
                    <p>大家可以就今日嘅主題隨便發問。</p>
                </div>
            `
        }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;

    const imgElement = document.getElementById('slide-img');
    const textElement = document.getElementById('slide-text-content');
    const counterElement = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fsBtn = document.getElementById('fullscreenBtn');

    function loadSlide(index) {
        textElement.innerHTML = slides[index].html;
        
        const slideNum = slides[index].id;
        imgElement.src = `${imageBaseUrl}${slideNum}.jpg`;

        counterElement.textContent = `${index + 1} / ${totalSlides}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === totalSlides - 1;
    }

    function changeSlide(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < totalSlides) {
            currentIndex = newIndex;
            loadSlide(currentIndex);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(err.message);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    document.addEventListener('fullscreenchange', (event) => {
        if (document.fullscreenElement) {
            fsBtn.innerHTML = "&#10005; 離開全螢幕";
        } else {
            fsBtn.innerHTML = "&#9974; 全螢幕";
        }
    });

    document.addEventListener('keydown', function(event) {
        if(event.key === "ArrowRight") {
            changeSlide(1);
        } else if(event.key === "ArrowLeft") {
            changeSlide(-1);
        }
    });

    loadSlide(currentIndex);

</script>

</body>
</html>
